# Gateway edge config (http-level, loaded before the server blocks via
# conf.d/00-rate-limit.conf). Real-client-IP recovery and the rate-limit zones
# both live here because both must sit in the http{} context.

# --- Real client IP (behind the cloudflared sidecar) ------------------------
# External access is via a Cloudflare Tunnel: the `cloudflared` container
# proxies to gateway:8081 over the internal Docker network, forwarding the
# visitor in CF-Connecting-IP. nginx's peer is therefore cloudflared's Docker
# bridge IP, NOT a Cloudflare public IP. Without this, $binary_remote_addr is
# the single cloudflared container IP and every external visitor shares one
# rate-limit bucket. This MUST be http-level: the realip handler runs before
# the server block is resolved, so set_real_ip_from in a server block does not
# reach the limit_req key (verified). It applies to both ports, but only
# matters on 8081 - port 80 is loopback-only, unauthenticated and unthrottled.
# Trust only the Docker private range (syn-internal has no pinned subnet);
# loopback is deliberately not trusted. This blocks EXTERNAL forgery (8081 is
# never host-published), not a peer already compromised inside syn-internal.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header CF-Connecting-IP;

# --- Rate-limit zones -------------------------------------------------------
# api/webhooks: DoS throttle on the proxied API surface.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/s;
# auth: origin-side brute-force backstop, applied at server scope on the
# authenticated tunnel port (8081) so every Basic-Auth path is covered. The
# primary brute-force control is a Cloudflare Rate Limiting rule on 401
# responses; this backstop guards against a misconfigured edge rule.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

# Gateway edge config (http-level, loaded before the server blocks via
# conf.d/00-rate-limit.conf). Two concerns live here because both must sit in
# the http{} context: recovering the real client IP from Cloudflare, and the
# rate-limit zones consumed by limit_req in the server locations.

# --- Real client IP (behind the cloudflared sidecar) ------------------------
# External access is via a Cloudflare Tunnel: the `cloudflared` container
# (docker-compose.cloudflare.yaml) proxies to gateway:8081 over the internal
# Docker network, forwarding the visitor's address in CF-Connecting-IP. nginx's
# direct peer is therefore cloudflared's Docker IP, NOT a Cloudflare public IP,
# so trusting Cloudflare's public ranges would never match. Without this,
# $binary_remote_addr is the single cloudflared container IP: every external
# visitor shares one rate-limit bucket and access logs show cloudflared, not
# the client. Trust the private Docker networks (syn-internal has no pinned
# subnet, so match RFC1918) and take the real client from CF-Connecting-IP.
# Safe because port 8081 is never host-published under the tunnel overlay - the
# only way to reach it is through cloudflared, so an external client cannot
# forge CF-Connecting-IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
real_ip_header CF-Connecting-IP;

# --- Rate-limit zones (http-level, loaded before server blocks) -------------
# api/webhooks: DoS throttle on the proxied API surface.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/s;
# auth: defense-in-depth on the credential-bearing dashboard root. The primary
# brute-force control is a Cloudflare Rate Limiting rule on 401 responses; this
# is the origin-side backstop so a misconfigured edge rule is not the only
# guard. The root serves few requests per real page load (index.html; static
# assets are under /assets/), so a modest rate does not affect legitimate use.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

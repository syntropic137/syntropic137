# Rate-limit zones (http-level, loaded before the server blocks via
# conf.d/00-rate-limit.conf). Zones MUST be defined in the http{} context; they
# are consumed by limit_req in the server/location blocks. Real-client-IP
# recovery (set_real_ip_from / real_ip_header) lives in the port 8081 server
# block in nginx.conf, so $binary_remote_addr here keys on the true visitor.
#
# api/webhooks: DoS throttle on the proxied API surface.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/s;
# auth: origin-side brute-force backstop, applied at server scope on the
# authenticated tunnel port (8081) so every Basic-Auth path is covered. The
# primary brute-force control is a Cloudflare Rate Limiting rule on 401
# responses; this backstop guards against a misconfigured edge rule.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

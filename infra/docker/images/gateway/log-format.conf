# Access-log format (http-level, loaded before the server blocks via
# conf.d/00-log-format.conf). Every server block in nginx.conf and
# nginx.conf.dev names it in its own access_log, which also replaces the
# image's http-level default rather than logging each request twice.
#
# The leading fields are nginx's stock "main" format, unchanged and in the
# same order, so anything already reading the gateway log keeps working. The
# timings are appended, in seconds, and answer the question #1583 could not:
# when a client waits, was it the API (upstream times large) or something in
# front of nginx (request_time large, upstream times small or absent)?
#
#   rt   $request_time            first client byte read -> last byte sent
#   uct  $upstream_connect_time   connecting to the API
#   uht  $upstream_header_time    connect -> API response headers (handler time)
#   urt  $upstream_response_time  connect -> last API byte
#
# Upstream fields are "-" for requests nginx served itself (the dashboard).
log_format syn_timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'uht=$upstream_header_time urt=$upstream_response_time';

# Syn137 Dashboard UI - nginx configuration
# Handles SPA routing, API proxying, and optional basic auth.
#
# Two server blocks. Neither decides its own auth: docker-entrypoint.sh writes
# one stanza per listener at startup, from SYN_GATEWAY_BIND and
# SYN_API_PASSWORD, under the single rule "reachable from beyond this host
# means authenticated".
#
#   Port 80  — the host-published listener. No auth while SYN_GATEWAY_BIND is
#              loopback (local dev/testing/Playwright); basic auth, and the
#              container refuses to start without a password, once it is not.
#   Port 8081 — tunnel access, basic auth required (when SYN_API_PASSWORD is set)
#
# Webhook endpoint bypasses auth on both ports (HMAC signature verified by app).

# ============================================================================
# PORT 80 — Host-published listener (auth follows SYN_GATEWAY_BIND)
# ============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    include /etc/nginx/conf.d/security-headers.conf;

    # Basic auth (generated by entrypoint — "off" while the bind is loopback,
    # which is the default and the only case that reaches this listener from
    # the host alone). When the bind is not loopback this file also carries the
    # limit_req backstop the 8081 block declares below, for the same reason:
    # the listener has become a credential-guessing target.
    include /tmp/nginx-auth/auth-host.conf;

    # --- Proxy locations (shared pattern) ---
    include /tmp/nginx-auth/locations.conf;
}

# ============================================================================
# PORT 8081 — Tunnel / external access (basic auth when configured)
# ============================================================================
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    include /etc/nginx/conf.d/security-headers.conf;

    # Basic auth (generated by entrypoint — "off" when no password set)
    include /tmp/nginx-auth/auth-tunnel.conf;

    # Recover the real client IP from the cloudflared sidecar, scoped to this
    # tunnel port so port 80, which has no proxy in front of it, never rewrites
    # addresses.
    # cloudflared proxies to gateway:8081 over the internal Docker bridge, so
    # nginx's peer is a Docker bridge address (not a Cloudflare public IP) and
    # forwards the visitor in CF-Connecting-IP. Without this, $binary_remote_addr
    # is the single cloudflared IP and every visitor shares one rate-limit
    # bucket. syn-internal has no pinned subnet, so trust the Docker private
    # range; loopback is not trusted. This blocks EXTERNAL forgery (8081 is
    # never host-published), not a peer already compromised inside syn-internal.
    # A pinned cloudflared subnet/IP would tighten it further.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    # Origin-side brute-force backstop for the whole authenticated port. Applied
    # at server scope so every Basic-Auth path is covered; locations with their
    # own limit_req (api, webhooks) do NOT inherit it, so /api/v1/ adds the auth
    # zone explicitly (see locations.conf) and the unauthenticated webhook does
    # not. Port 80 gets the same backstop from its generated auth-host.conf,
    # but only when it is bound off loopback and therefore authenticated. The
    # PRIMARY brute-force control is the Cloudflare 401 rate-limit rule - see
    # ADR-059.
    limit_req zone=auth burst=20 nodelay;
    limit_req_status 429;

    # --- Proxy locations (shared pattern) ---
    include /tmp/nginx-auth/locations.conf;
}

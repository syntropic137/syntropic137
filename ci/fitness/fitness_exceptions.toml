[typed_projection_handlers]
# Projection handler parameters that do not declare a typed payload (#1268).
# Key format: "<file>:<qualname>.param:<name>". Gate:
# ci/fitness/code_quality/test_typed_projection_handlers.py
#
# RATCHET, ONE DIRECTION. This table is the whole budget - there is no number
# to raise. Adding an entry means adding an untyped handler, and reviewers
# should refuse it. Removing one means a handler was typed, and
# test_no_stale_grandfathered_handlers REQUIRES the entry to go with it, so a
# fixed site cannot leave standing permission to break again.
#
# These 173 were never budgeted debt - they were unmeasured. A bare `dict`
# annotation scores zero against the per-package ratchet in
# fitness-exceptions.toml by design, so they consumed none of syn-domain's 440.
#
# The count went 110 -> 171 when review found the gate narrower than its own
# claim (PR #1281). Not a relaxed ratchet: 61 sites that were always this
# defect became visible when the population stopped being a list of name
# prefixes and the accepted annotation stopped being a list of rejected
# spellings. Same re-baselining as #1188 and #1248, same rule - the number may
# only go down from here.
#
# 171 -> 173 for the third time in the same shape: the taint walk that decides
# which helpers a payload REACHES read only `ast.Assign`/`ast.AnnAssign`, so a
# payload carved out by `for`, a comprehension, `with ... as` or `:=` handed
# the receiving helper nothing the gate could follow. Those two helpers were
# never passing this gate - it had never read them. Same rule still: down only.
#
# `verdict` is why it fails, and the three are the gate's whole vocabulary:
#   string-keyed   a mapping at any nesting, whatever its key and value types
#   undeclared     no annotation at all, or one naming Any/object
#   no-fields      a type declared in that module that is none of the four
#                  accepted kinds - every TypedDict lands here
#
# Fix with a @dataclass or a Pydantic BaseModel. NOT a TypedDict: it is read by
# string key and validates nothing at runtime, so it reproduces both halves of
# the defect under a name that looks typed (AGENTS.md; PR #1246, #1248).
# `annotation` records what is there now, so a diff shows what changed.



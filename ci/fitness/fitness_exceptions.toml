[unknown_has_a_representation]
# Branches that return a real-looking answer after catching an exception (#1341).
# Key format: "<file>:<qualname>". Gate:
# ci/fitness/code_quality/test_unknown_has_a_representation.py
#
# RATCHET, ONE DIRECTION. The table is the whole budget - there is no number to
# raise. An entry means a caller cannot tell "I looked, and there are none"
# from "I could not find out", and reviewers should refuse a new one.
# test_no_stale_seeded_sites REQUIRES the entry to go in the diff that fixes
# the site, so a fix cannot leave standing permission to break again.
#
# Seeded ahead of the fixes, deliberately: the rule lands first so the fixes
# land against a gate that already names them. The three sites #1341 was
# written from are on PR #1332 (#1262) and PR #1330 (#1319). Only the first is
# in this table - see the gate's docstring for why a fall-through `return 0`
# with no except block is outside what this rule can see, and #1318's health
# lag was already fixed by #1172 before #1341 was filed.
#
# The other eight were found by the gate itself when it first ran. They are
# the same defect, with no fix PR yet, so they are tracked against #1341.

# --- #1262, fix on PR #1332: telemetry outage reads as a stalled phase -------
"packages/syn-adapters/src/syn_adapters/projections/session_tools_queries.py:query_session_tools" = { issue = "#1262" }

# --- #1341, found by this gate on its first run, no fix PR yet ---------------

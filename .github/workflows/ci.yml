name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main, release]
  workflow_dispatch:
  schedule:
    # Run integration tests weekly on Sunday at 2am UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ISS-259: Least-privilege default — jobs that need write access (e.g. publishing)
# must explicitly declare it. Prevents a compromised step from pushing code or
# modifying releases without an obvious diff in the workflow file.
permissions:
  contents: read

jobs:
  #############################################################################
  # PYTHON QA - Fast checks (lint, format, typecheck)
  #############################################################################

  python-qa:
    name: Python QA
    runs-on: ubuntu-latest
    steps:
      # ISS-259: Pinned to commit SHA instead of mutable tag (@v4).
      # A tag can be silently repointed to a malicious commit (XZ-style attack).
      # SHA pins mean any change requires an explicit diff in this file.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup VSA CLI
        uses: ./.github/actions/setup-vsa

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Validate domain events
        run: uv run python scripts/validate_domain_events.py

      - name: VSA validation
        run: vsa validate

      # POKA-YOKE: Fail if xfail/skip without issue links
      - name: Check test debt
        run: uv run python scripts/check_test_debt.py

      # POKA-YOKE: Detect OpenAPI spec drift (endpoint-level).
      # Regenerates from the FastAPI app and compares endpoint paths + methods
      # against the committed spec. This is BLOCKING — missing endpoints fail CI.
      # We compare paths (not full JSON) because minor Python patch version
      # differences can produce equivalent but textually different Pydantic
      # schemas. Path-level comparison catches the real issue: endpoints added
      # or removed without regenerating the spec.
      - name: OpenAPI spec drift check
        run: |
          uv run python scripts/check_openapi_drift.py

  #############################################################################
  # ARCHITECTURAL FITNESS - Structural invariant enforcement
  #############################################################################

  architectural-fitness:
    name: Architectural Fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # ISS-259: @stable is a branch, not a tag — especially important to pin.
      # dtolnay/rust-toolchain moves stable forward continuously; a supply chain
      # compromise here would execute arbitrary code during Rust toolchain setup.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      # Key the cache on the submodule commit, not Cargo.lock. An APSS bump can
      # change Rust sources, manifests, or the [[bin]] target name without
      # touching Cargo.lock, and a Cargo.lock-keyed cache would then restore
      # binaries built from a different revision. `git rev-parse HEAD:<path>`
      # reads the gitlink, so any bump invalidates the cache exactly.
      - name: Resolve APSS submodule commit
        id: apss-commit
        run: echo "sha=$(git rev-parse HEAD:lib/agent-paradise-standards-system)" >> "$GITHUB_OUTPUT"

      - name: Cache APS CLI binary
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: lib/agent-paradise-standards-system/target/release
          key: aps-cli-${{ runner.os }}-${{ steps.apss-commit.outputs.sha }}

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      # preflight also runs `vsa validate`, and `vsa` comes from the
      # event-sourcing-platform submodule rather than the runner image. Without
      # this the recipe dies at exit 127 - the SAME failure mode the pnpm note
      # below describes, arriving from the other missing toolchain. The
      # cache-key-suffix keeps this job's cache distinct from the lint job's so
      # neither can serve the other a binary built from a different submodule
      # pin (see the poka-yoke note in the action itself).
      - name: Setup VSA CLI
        uses: ./.github/actions/setup-vsa
        with:
          cache-key-suffix: fitness

      # preflight includes codegen-check, and codegen shells out to pnpm in
      # three workspaces. Without this the whole target dies at exit 127 and
      # the failure names the recipe rather than the missing toolchain.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace deps for codegen
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ONE list, shared with the pre-push hook and the AGENTS.md checklist.
      # Enumerating the checks here as separate steps is what let CI and local
      # drift: three of them were reachable from no local recipe at all, so
      # they could only fail after a push (#931). Add new gates to `preflight`
      # in the justfile, never here.
      - name: Preflight (every gate, same target the hook runs)
        run: just preflight

  #############################################################################
  # PYTHON UNIT TESTS - Fast, runs on every push
  #############################################################################

  python-unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests with coverage
        env:
          TERM: dumb
          NO_COLOR: "1"
          COLUMNS: "200"
        run: |
          uv run pytest -m unit \
            --cov=apps/syn-api/src \
            --cov=packages/syn-domain/src \
            --cov=packages/syn-adapters/src \
            --cov=packages/syn-shared/src \
            --cov-report=term-missing \
            -x -q

  #############################################################################
  # PYTHON INTEGRATION TESTS - Requires database services
  # Runs on: weekly schedule, pushes to main, and workflow_dispatch
  # Skipped on: feature branch PRs (for fast iteration)
  #############################################################################

  python-integration-tests:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    # Run on: weekly cron, main branch pushes, manual dispatch
    # Tiering: feature-branch PRs stay fast on unit tests alone; integration
    # runs on the weekly cron, on main, and - critically - on release PRs, which
    # are the last chance to catch a regression before it ships.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'release')

    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: syn
          POSTGRES_PASSWORD: syn_dev_password
          POSTGRES_DB: syn
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # TODO(#343): Enable EventStore + Collector services when containers are published
      # eventstore:
      #   image: ghcr.io/syntropic137/event-store:latest
      #   ports:
      #     - 55051:50051
      #   options: >-
      #     --health-cmd "grpc_health_probe -addr=:50051"
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          TERM: dumb
          NO_COLOR: "1"
          COLUMNS: "200"
          # Point tests to CI services (test_infrastructure fixture auto-detects)
          TEST_TIMESCALEDB_HOST: localhost
          TEST_TIMESCALEDB_PORT: "15432"
          TEST_EVENTSTORE_HOST: localhost
          TEST_EVENTSTORE_PORT: "55051"
        run: |
          uv run pytest -m integration -x -q

  #############################################################################
  # DASHBOARD UI - TypeScript checks
  #############################################################################

  dashboard-ui:
    name: Dashboard UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      # ISS-259: --ignore-scripts prevents postinstall hooks from executing
      # arbitrary code during install — a common npm supply chain vector.
      - name: Install ui-feedback-react dependencies
        working-directory: lib/ui-feedback/packages/ui-feedback-react
        run: pnpm install --ignore-scripts

      # Standardized on pnpm across all frontend apps (was npm, creating duplicate
      # lock files and inconsistent audit coverage). --frozen-lockfile ensures CI
      # installs exactly what's locked. --ignore-scripts blocks postinstall hooks.
      - name: Install dashboard dependencies
        working-directory: apps/syn-dashboard-ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Link ui-feedback-react
        working-directory: apps/syn-dashboard-ui
        run: pnpm link ../../lib/ui-feedback/packages/ui-feedback-react

      - name: Lint
        working-directory: apps/syn-dashboard-ui
        run: pnpm run lint

      - name: Build
        working-directory: apps/syn-dashboard-ui
        run: pnpm run build

  #############################################################################
  # DOCS SITE - Fumadocs build check
  #############################################################################

  docs-site:
    name: Docs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install dependencies
        working-directory: apps/syn-docs
        run: pnpm install

      - name: Build
        working-directory: apps/syn-docs
        run: pnpm run build

  #############################################################################
  # CLI NODE - TypeScript checks, tests, API drift detection
  #############################################################################

  cli-node:
    name: CLI Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: apps/syn-cli-node
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        working-directory: apps/syn-cli-node
        run: pnpm run typecheck

      - name: Run tests
        working-directory: apps/syn-cli-node
        env:
          NO_COLOR: "1"
        run: pnpm run test

      - name: Build
        working-directory: apps/syn-cli-node
        run: pnpm run build

      - name: API drift check
        working-directory: apps/syn-cli-node
        run: pnpm run check:api-drift

      - name: Typed API enforcement
        working-directory: apps/syn-cli-node
        run: pnpm run check:untyped-api

  #############################################################################
  # SUBMODULE VALIDATION - Ensure submodules are properly referenced
  #############################################################################

  submodule-check:
    name: Submodule Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Verify submodules
        run: |
          echo "Checking submodule status..."
          git submodule status

          # Verify submodules are initialized
          if [ ! -f "lib/agentic-primitives/README.md" ]; then
            echo "❌ agentic-primitives submodule not initialized"
            exit 1
          fi

          if [ ! -f "lib/event-sourcing-platform/README.md" ]; then
            echo "❌ event-sourcing-platform submodule not initialized"
            exit 1
          fi

          echo "✅ All submodules properly initialized"

  #############################################################################
  # DEFAULT WORKSPACE IMAGE - execute the image every deployment actually pulls
  #
  # The rest of CI never runs it. workspace-build/_workspace-check build a LOCAL
  # claude-cli image for the dev loop, and e2e-container builds claude-cli too,
  # so after the default moved to omni nothing executed the pinned digest.
  #
  # This probes THROUGH /opt/agentic/entrypoint.sh rather than around it: an
  # entrypoint regression reaching a published image is the documented incident
  # that motivated digest pinning, and --entrypoint <bin> would sail past it.
  #
  # Pulls a multi-GB image, so it is path-filtered to changes that can alter
  # which image is pulled. It is in ci-success's needs list, so when it runs it
  # blocks.
  #############################################################################

  default-workspace-image:
    name: Default Workspace Image
    runs-on: ubuntu-latest
    steps:
      # Full history: the path filter below diffs against the base ref, and a
      # shallow clone has no merge base with it. The first version of this job
      # used the default depth, the diff failed with "no merge base", the else
      # branch ran, and the job reported "pin cannot have changed" and passed -
      # a false green in the gate written to catch false greens.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          # The recipe resolves the pin by importing syn_shared, and this repo's
          # uv workspace has editable members inside lib/agentic-primitives, so
          # `uv run` cannot resolve the environment without them.
          submodules: true

      - name: Check whether the pinned default could have changed
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet origin "${{ github.base_ref }}"
          # FAIL CLOSED. If the diff cannot be computed we do not know whether
          # the pin moved, and "we do not know" must mean run the check, not
          # skip it. Only a diff that succeeds AND matches nothing may skip.
          if ! CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>&1); then
            echo "::warning::Could not diff against origin/${{ github.base_ref }} ($CHANGED). Running the check rather than assuming the pin is unchanged."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$CHANGED" | grep -qE 'workspace_images\.py|justfile|\.github/workflows/ci\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Pin provably unchanged in this diff; skipping the image pull."
          fi

      - name: Install uv
        if: steps.filter.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install just
        if: steps.filter.outputs.run == 'true'
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Probe the pinned default image through its entrypoint
        if: steps.filter.outputs.run == 'true'
        run: just check-default-workspace-image

  #############################################################################
  # OSV VULNERABILITY SCAN - Supply chain security (ISS-259)
  #
  # Google's OSV Scanner checks all lock files against the OSV database
  # (covers CVEs, GitHub Security Advisories, and ecosystem-specific DBs).
  # Scans both Python (uv.lock) and all npm/pnpm lock files in one step.
  #
  # Baseline confirmed clean — supply chain checks are now blocking.
  #############################################################################

  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run OSV Scanner
        # v1.9.0 restructured the repo — root action.yml lost its `runs:` section.
        # The actual action now lives in the osv-scanner-action/ subdirectory.
        # SHA confirmed: gh api repos/google/osv-scanner-action/git/ref/tags/v1.9.0
        uses: google/osv-scanner-action/osv-scanner-action@19ec1116569a47416e11a45848722b1af31a857b # v1.9.0
        with:
          scan-args: |-
            --lockfile=uv.lock
            --lockfile=pnpm-lock.yaml

  #############################################################################
  # PIP-AUDIT - Python dependency audit against PyPI advisory database
  #
  # Complements OSV Scanner — pip-audit catches PyPI-specific advisories that
  # OSV may not yet index. Uses uv to export the locked dependency list, then
  # audits each package against known vulnerabilities.
  #
  # Context: litellm supply chain attack (2026-03-24) demonstrated that a single
  # compromised PyPI package can exfiltrate SSH keys, cloud creds, and more from
  # every downstream consumer — including transitive dependents.
  #############################################################################

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Need uv to export the locked dependency list from uv.lock.
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      # pip-audit is installed as an isolated tool — not a project dependency.
      # This keeps it out of the project's own dependency tree, preventing any
      # circular trust issues (auditor can't be poisoned by the auditee).
      # Pin pip-audit version — ironic to leave a security tool unpinned in a
      # supply-chain hardening job. uv tool run invokes it without relying on
      # the tool bin dir being on PATH.
      - name: Install pip-audit
        run: uv tool install pip-audit==2.7.3

      # Export locked deps from uv.lock → requirements.txt format, then pipe
      # to pip-audit. --disable-pip queries the PyPI JSON API directly instead
      # of shelling out to pip (faster, fewer moving parts).
      - name: Audit Python dependencies
        run: |
          uv export --format requirements-txt --no-hashes --frozen --quiet \
            | uv tool run pip-audit --disable-pip --no-deps \
              --ignore-vuln GHSA-5239-wwwm-4pmq \
              --ignore-vuln GHSA-p423-j2cm-9vmq \
              --ignore-vuln GHSA-6w46-j5rx-g56g \
              --ignore-vuln GHSA-mj87-hwqh-73pj \
              --ignore-vuln GHSA-65pc-fj4g-8rjx \
              --ignore-vuln PYSEC-2026-179 \
              --ignore-vuln PYSEC-2026-175 \
              --ignore-vuln PYSEC-2026-177 \
              --ignore-vuln PYSEC-2026-178 \
              --ignore-vuln GHSA-pp6c-gr5w-3c5g \
              --ignore-vuln PYSEC-2026-161 \
              --ignore-vuln PYSEC-2026-142 \
              --ignore-vuln PYSEC-2026-141 \
              --ignore-vuln GHSA-4xgf-cpjx-pc3j \
              --ignore-vuln PYSEC-2026-3552 \
              -r /dev/stdin
          # TODO(#805): remove --ignore-vuln PYSEC-2026-3552 once cryptography 50.0.0 resolves through uv (published, but absent from the simple index)
          # TODO(#345): remove --ignore-vuln once pygments releases a fix
          # TODO(#776): remove --ignore-vuln GHSA-4xgf-cpjx-pc3j once pydantic-settings 2.14.2 is on PyPI (secrets_nested_subdir symlink escape; feature unused here)
          # TODO(#634): remove --ignore-vuln once cryptography 46.0.7 is available on PyPI
          # TODO(#678): remove --ignore-vuln GHSA-6w46-j5rx-g56g once pytest 9.0.3 is available on PyPI
          # TODO(#696): remove --ignore-vuln GHSA-mj87-hwqh-73pj once python-multipart 0.0.26 is available on PyPI
          # TODO(#766): June 2026 audit allowlist — remove each as the upstream fix lands in uv.lock:
          #   - GHSA-65pc-fj4g-8rjx (idna >= 3.15)
          #   - PYSEC-2026-179 / 175 / 177 / 178 (pyjwt >= 2.13.0)
          #   - GHSA-pp6c-gr5w-3c5g (python-multipart >= 0.0.27)
          #   - PYSEC-2026-161 (starlette >= 1.0.1)
          #   - PYSEC-2026-142 / 141 (urllib3 >= 2.7.0)

  #############################################################################
  # DEPENDENCY REVIEW - Block new CVE-laden packages on PRs (ISS-259)
  #
  # Runs only on pull_request events — compares the base vs head dependency
  # graph and fails if any newly added package has known vulnerabilities or
  # contains install scripts (deny-script-packages).
  #############################################################################

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # ISS-259: Pinned to SHA (v4.9.0). Flags newly added packages with CVEs
      # or install scripts — catches supply chain risks at PR review time.
      # Requires GitHub Advanced Security (free for public repos).
      - name: Dependency Review
        uses: actions/dependency-review-action@f5b971718edcbb31275a1db40004592335c0e031 # v4.9.0

  #############################################################################
  # SUMMARY - Required status check for PRs
  #############################################################################

  ci-success:
    name: CI Success
    if: always()
    needs:
      - python-qa
      - architectural-fitness
      - python-unit-tests
      - python-integration-tests
      - dashboard-ui
      - cli-node
      - docs-site
      - submodule-check
      - default-workspace-image
      - osv-scan
      - pip-audit
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          # Check for failures (integration tests are optional on non-PR)
          if [[ "${{ needs.python-qa.result }}" == "failure" ]] || \
             [[ "${{ needs.architectural-fitness.result }}" == "failure" ]] || \
             [[ "${{ needs.python-unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.dashboard-ui.result }}" == "failure" ]] || \
             [[ "${{ needs.cli-node.result }}" == "failure" ]] || \
             [[ "${{ needs.docs-site.result }}" == "failure" ]] || \
             [[ "${{ needs.submodule-check.result }}" == "failure" ]] || \
             [[ "${{ needs.osv-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.pip-audit.result }}" == "failure" ]]; then
            echo "❌ CI checks failed"
            exit 1
          fi

          # Integration tests: whenever they RAN, they must have passed.
          #
          # This used to read `event_name == 'pull_request' && result == failure`,
          # which was the exact inverse of the job's own `if:` - the job never ran
          # on a PR, so the check could never fire, and on the runs where it DID
          # execute (weekly cron, main, dispatch) nothing required it. A failing
          # integration test could not fail any gate. See
          # docs/retrospectives/2026-08-17-green-checks-that-check-nothing.md
          #
          # Keyed on the result, not the trigger: `skipped` is a deliberate tier
          # choice on feature-branch PRs, `failure` is never acceptable.
          if [[ "${{ needs.python-integration-tests.result }}" == "failure" ]]; then
            echo "❌ Integration tests failed"
            exit 1
          fi

          # A release PR must not ship on unit tests alone. If integration did
          # not actually run here, that is a misconfiguration, not a pass.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "release" ]] && \
             [[ "${{ needs.python-integration-tests.result }}" != "success" ]]; then
            echo "❌ Release PR requires integration tests to RUN and pass"
            echo "   (result: ${{ needs.python-integration-tests.result }})"
            exit 1
          fi

          # Dependency review only runs on PRs (requires base/head comparison)
          if [[ "${{ github.event_name }}" == "pull_request" ]] && \
             [[ "${{ needs.dependency-review.result }}" == "failure" ]]; then
            echo "❌ Dependency review failed"
            exit 1
          fi

          # Check for cancellations
          if [[ "${{ needs.python-qa.result }}" == "cancelled" ]] || \
             [[ "${{ needs.architectural-fitness.result }}" == "cancelled" ]] || \
             [[ "${{ needs.python-unit-tests.result }}" == "cancelled" ]] || \
             [[ "${{ needs.dashboard-ui.result }}" == "cancelled" ]] || \
             [[ "${{ needs.cli-node.result }}" == "cancelled" ]] || \
             [[ "${{ needs.docs-site.result }}" == "cancelled" ]] || \
             [[ "${{ needs.osv-scan.result }}" == "cancelled" ]] || \
             [[ "${{ needs.pip-audit.result }}" == "cancelled" ]]; then
            echo "⚠️ CI checks were cancelled"
            exit 1
          fi

          echo "✅ All CI checks passed!"

      - name: Write summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python QA | ${{ needs.python-qa.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architectural Fitness | ${{ needs.architectural-fitness.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Unit Tests | ${{ needs.python-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Integration Tests | ${{ needs.python-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard UI | ${{ needs.dashboard-ui.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI Node | ${{ needs.cli-node.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Submodule Check | ${{ needs.submodule-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OSV Scan | ${{ needs.osv-scan.result }} |" >> $GITHUB_STEP_SUMMARY

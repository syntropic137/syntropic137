name: Integration Evidence

# Runs the WHOLE integration suite on a PR head and records, for each test a
# phase named, whether it ran and passed. Plan
# docs/plans/20261015_platform-dispatched-evidence.md §A.1 and §A.15 PR 3.
#
# Why it exists: ci.yml skips integration on PRs into main, and agent
# workspaces have no Docker, so a change that needs integration proof had no
# way to get it short of a person dispatching ci.yml. Dispatch only:
#
#   gh workflow run integration-evidence.yml --ref main \
#     -f pr=<pr> -f tests="<node id> <node id>" -f dispatch_id=<nonce>
#
# The runner is scripts/integration_evidence.py; read its docstring for what
# `passed`, `failed` and `void` prove. `just test-integration-ci` runs the
# same script locally.
#
# The contract the platform depends on (plan §A.1): inputs `pr`, `tests` and
# `dispatch_id`; `dispatch_id` in the run name; an artifact named `evidence`
# holding `evidence.json`.
#
# SECURITY MODEL. This runs PR code ON THE RUNNER HOST, like ci.yml's
# integration job and mutation-evidence.yml with `docker: true`: the suite
# drives Docker and real services, and a container holding the Docker socket
# is the host anyway. So the verdict is evidence about honest PR code, not a
# security boundary. What still holds:
# - Inputs reach shell only through env vars and are validated by the trusted
#   script before anything else runs.
# - Fork PRs are refused: only branches in this repository, which already
#   required write access to push.
# - The workflow, the runner script and the setup action come from the
#   dispatched ref (`trusted/`), never from the PR head (`pr/`).
# - The job that runs PR code has `contents: read`, no secrets, no persisted
#   credentials and no cache (`cache-mode: none`, `enable-cache: 'false'`), so
#   nothing it plants is restored by another workflow. (actionlint 1.7.12 does
#   not know `cache-mode` yet; .github/actionlint.yaml ignores exactly that
#   error for this file.)
# - The `pull-requests: write` token exists only in the comment job, on a
#   fresh runner, and posts the report the runner wrote.
# - Trusted host steps run stdlib-only scripts on setup-python's interpreter
#   with `python -I`, never through uv: `uv run` discovers a virtualenv in the
#   working directory, and a PR can commit a `.venv` whose `bin/python` is
#   anything.

run-name: "Integration evidence for PR #${{ inputs.pr }} ${{ inputs.dispatch_id }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: number
      tests:
        description: 'Space-separated pytest node ids (path/test_x.py::test_y) that must run and pass'
        required: true
        type: string
      dispatch_id:
        description: 'Optional nonce shown in the run name, so a dispatcher can find its own run'
        required: false
        default: ''
        type: string

permissions: {}

cache-mode: none

# One group per dispatch, as in mutation-evidence.yml (PC-197): a run can be
# cancelled only by its own attempt. `github.run_id` keeps a nonce-less
# dispatch in a group of its own, because GitHub cancels a PENDING run in a
# shared group when a newer one queues, even with cancel-in-progress false.
concurrency:
  group: integration-evidence-pr-${{ inputs.pr }}-${{ inputs.dispatch_id || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate inputs and resolve PR head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The script validates the SHA too, so this step passes a well-formed
      # placeholder: the real head is resolved below, after the inputs pass.
      - name: Validate inputs
        env:
          INTEGRATION_PR: ${{ inputs.pr }}
          INTEGRATION_TESTS: ${{ inputs.tests }}
          INTEGRATION_DISPATCH_ID: ${{ inputs.dispatch_id }}
          INTEGRATION_SHA: "0000000000000000000000000000000000000000"
        run: python -I scripts/integration_evidence.py validate

      - name: Resolve PR head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          pr_json="$(gh api "repos/$REPO/pulls/$PR")"
          state="$(jq -r .state <<<"$pr_json")"
          head_repo="$(jq -r .head.repo.full_name <<<"$pr_json")"
          sha="$(jq -r .head.sha <<<"$pr_json")"
          if [ "$state" != open ]; then
            echo "::error::PR #$PR is $state; evidence is only gathered for open PRs"
            exit 1
          fi
          if [ "$head_repo" != "$REPO" ]; then
            echo "::error::PR #$PR comes from $head_repo; fork PRs are refused"
            exit 1
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected head sha: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PR #$PR head: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Full integration suite
    needs: resolve
    runs-on: ubuntu-latest
    # The runner's own pytest timeout is 45 minutes; this leaves room for
    # setup and the uploads.
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      # Same service as ci.yml python-integration-tests. A composite action
      # cannot declare services, so this block is the one duplicated piece.
      timescaledb:
        image: timescale/timescaledb:2.29.2-pg16
        env:
          POSTGRES_USER: syn
          POSTGRES_PASSWORD: syn_dev_password
          POSTGRES_DB: syn
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout trusted tooling (dispatched ref)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: trusted
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: pr
          submodules: true
          persist-credentials: false

      - name: Python integration environment
        uses: ./trusted/.github/actions/python-integration-env
        with:
          working-directory: pr
          timescaledb-network: ${{ job.services.timescaledb.network }}
          timescaledb-container: ${{ job.services.timescaledb.id }}
          install-dependencies: 'false'
          enable-cache: 'false'

      # setup-python is pinned to 3.12; a cached or preinstalled interpreter
      # answering instead would make the evidence about another Python.
      - name: Assert the pinned Python
        run: |
          version="$(python -I -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "python $version"
          if [ "$version" != "3.12" ]; then
            echo "::error::expected Python 3.12 from setup-python, got $version"
            exit 1
          fi
          uv --version

      # Frozen, so the evidence is about the PR's committed uv.lock and not a
      # re-resolved one. All extras, as ci.yml's integration job installs.
      - name: Install PR dependencies
        working-directory: pr
        run: uv sync --all-extras --frozen

      - name: Run the integration suite
        working-directory: trusted
        env:
          INTEGRATION_PR: ${{ inputs.pr }}
          INTEGRATION_TESTS: ${{ inputs.tests }}
          INTEGRATION_DISPATCH_ID: ${{ inputs.dispatch_id }}
          INTEGRATION_SHA: ${{ needs.resolve.outputs.sha }}
          TERM: dumb
          NO_COLOR: "1"
          COLUMNS: "200"
          TEST_TIMESCALEDB_HOST: localhost
          TEST_TIMESCALEDB_PORT: "15432"
          TEST_EVENTSTORE_HOST: localhost
          TEST_EVENTSTORE_PORT: "55051"
          # Any image with sh. Without it the Docker operation contract tests skip,
          # so they can never be evidenced (#1928 reverify finding A).
          SYN_CONTRACT_TEST_IMAGE: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        # evidence.json goes in its own directory: the `evidence` artifact
        # uploads exactly that directory and nothing else from RUNNER_TEMP.
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python -I scripts/integration_evidence.py run --root "$GITHUB_WORKSPACE/pr" \
            --report "$RUNNER_TEMP/integration-evidence.md" \
            --evidence "$RUNNER_TEMP/evidence/evidence.json"

      - name: Job summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/integration-evidence.md
        run: |
          if [ -s "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written; read the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-evidence
          path: ${{ runner.temp }}/integration-evidence.md
          if-no-files-found: ignore
          retention-days: 30

      # The platform's evidence gate downloads this artifact BY NAME (plan
      # §A.1). Absent when pytest left no readable JUnit report: the gate then
      # reads "no evidence", never a verdict nothing backs.
      - name: Upload evidence.json
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence/evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Event store logs
        if: failure()
        run: docker logs eventstore || true

  comment:
    name: Post evidence on the PR
    needs: [resolve, evidence]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-evidence
          path: report

      - name: Create or update the marker comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RESULT: ${{ needs.evidence.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- integration-evidence -->'
          body="$RUNNER_TEMP/body.md"
          if [ -s report/integration-evidence.md ]; then
            head -c 60000 report/integration-evidence.md > "$body"
          else
            # shellcheck disable=SC2016 # literal backticks are markdown
            printf '%s\n## Integration evidence\n\n**FAIL** | PR #%s | head `%s` | [run](%s)\n\nThe evidence job ended `%s` before writing a report. Read the run log.\n' \
              "$marker" "$PR" "$SHA" "$RUN_URL" "$RESULT" > "$body"
          fi
          existing="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" \
            | head -n1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" >/dev/null
            echo "created comment"
          fi

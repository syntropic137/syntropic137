name: Skyline UI

# Skyline, the Svelte 5 rebuild of the dashboard (apps/syn-ui + packages/syn-ui/*).
# Conventions: packages/syn-ui/CONVENTIONS.md. The frozen React app keeps its
# own job in ci.yml; nothing here builds or tests it, except as the gateway
# image's SYN_GATEWAY_UI=legacy opt-out that the `gateway` job asserts.
#
# Every job has a recipe that runs the same commands locally
# (just/skyline-serve.just): skyline-ci, skyline-e2e, skyline-gateway-smoke.

on:
  pull_request:
    branches: [main, release]
    paths:
      - 'packages/syn-ui/**'
      - 'apps/syn-ui/**'
      # The desktop shell, and the bridge syn-ui imports from it.
      - 'apps/syn-desktop/**'
      # Install inputs: a lockfile or workspace change can break the build
      # without touching a Skyline file.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # Serving: the gateway image serves Skyline at /.
      - 'infra/docker/images/gateway/**'
      - 'infra/scripts/check_gateway_ui.py'
      - 'just/skyline.just'
      - 'just/skyline-serve.just'
      - '.github/workflows/syn-ui.yml'
  push:
    branches: [main]
    paths:
      - 'packages/syn-ui/**'
      - 'apps/syn-ui/**'
      - 'apps/syn-desktop/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infra/docker/images/gateway/**'
      - 'infra/scripts/check_gateway_ui.py'
      - 'just/skyline.just'
      - 'just/skyline-serve.just'
      - '.github/workflows/syn-ui.yml'
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: 'Rewrite every screenshot baseline and upload them (commit the artifact)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ISS-259: least-privilege default, as in ci.yml.
permissions:
  contents: read

jobs:
  #############################################################################
  # QA - install, check, test, build, size budget (just skyline-ci)
  #############################################################################

  qa:
    name: Skyline QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ISS-259: actions pinned to commit SHAs, same pins as ci.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      # --frozen-lockfile installs exactly what is locked; --ignore-scripts
      # blocks postinstall hooks (ISS-259). The filter keeps the install to
      # Skyline's graph, not the docs site or the React app.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'syn-ui...'

      # tsc / svelte-check --fail-on-warnings, the CSS token gate, theme parity.
      - name: Check
        run: pnpm --filter syn-ui --filter './packages/syn-ui/*' --workspace-concurrency=1 run check

      # svelte-check --threshold error / tsc --noEmit per package. `build`
      # runs this too, so a type error can never reach a bundle.
      - name: Typecheck
        run: pnpm --filter syn-ui --filter './packages/syn-ui/*' run typecheck

      # The published @syntropic137/design-contracts gate (just
      # skyline-verify-contracts): tokens present, no colour literals,
      # contract conformance, src/contract-adapter.ts exports the adapter.
      - name: Verify design contracts
        run: >-
          pnpm --filter @syn137/skyline-core exec design-system-verify
          --root "$GITHUB_WORKSPACE"
          --package packages/syn-ui/skyline-svelte-v5
          --tokens packages/syn-ui/themes/node_modules/@syntropic137/design-tokens/generated/design-tokens.css
          --typecheck "pnpm --filter @syn137/skyline-svelte-v5 run typecheck"

      - name: Test
        run: pnpm --filter syn-ui --filter './packages/syn-ui/*' run test

      # `build` runs vite build and then scripts/size-budget.mjs, so a budget
      # breach fails here. Built for /, the path production serves.
      - name: Build
        env:
          SYN_UI_BASE: /
        run: pnpm --filter syn-ui run build

      - name: Size budget (100 KB gzip first load)
        run: |
          # Re-reads the manifest the Build step wrote (cheap) to publish the
          # report; the default shell runs with -eo pipefail, so a breach fails.
          {
            echo '### Skyline size budget'
            echo '```'
            pnpm --silent --filter syn-ui run size
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The landing <sky-*> elements: one module per element plus one shared
      # runtime chunk; scripts/elements-size.mjs fails above 45 KB gzip.
      - name: Elements build (45 KB gzip)
        run: |
          {
            echo '### Skyline elements budget'
            echo '```'
            pnpm --silent --filter @syn137/skyline-svelte-v5 run build:elements
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  #############################################################################
  # E2E - the shared Playwright suite on fixtures data (just skyline-e2e)
  #############################################################################

  e2e:
    name: Skyline E2E (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'syn-ui...'

      # The app's own Playwright, so the browser build matches the runner.
      # The recipe fails with a clear message if @playwright/test is missing
      # from apps/syn-ui's devDependencies.
      - name: Install Chromium
        working-directory: apps/syn-ui
        run: |
          test -f node_modules/@playwright/test/cli.js || {
            echo '::error::@playwright/test is not a devDependency of apps/syn-ui; add "@playwright/test": "1.59.0"'
            exit 1
          }
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      # Builds a fixtures bundle at /, serves it with vite preview and runs
      # e2e/ against it (E2E_DATA=fixtures). CI=true turns on retries and the
      # HTML report in playwright.config.ts.
      - name: E2E suite
        run: just skyline-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyline-playwright-report
          path: |
            apps/syn-ui/e2e/.report
            apps/syn-ui/e2e/.results
          retention-days: 7
          if-no-files-found: ignore

  #############################################################################
  # SCREENSHOTS - /dev/components and /dev/patterns at 1440px and 390px against
  # the Linux Chromium baselines in apps/syn-ui/e2e/baselines
  # (just skyline-screenshots). Refreshing them: design/README.md.
  #############################################################################

  screenshots:
    name: Skyline screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'syn-ui...'

      - name: Install Chromium
        working-directory: apps/syn-ui
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      # Compare against the committed baselines. With none committed yet (first
      # run) or on a dispatch with update_screenshots, write them instead and
      # pass; the next step uploads them for a human to review and commit.
      - name: Screenshot tests
        env:
          UPDATE: ${{ inputs.update_screenshots && 'true' || 'false' }}
        run: |
          count=$(find apps/syn-ui/e2e/baselines -name '*-linux.png' 2>/dev/null | wc -l)
          if [ "$UPDATE" = true ] || [ "$count" -eq 0 ]; then
            echo "::warning::Writing screenshot baselines ($count committed). Download the skyline-screenshot-baselines artifact and commit it to apps/syn-ui/e2e/baselines."
            just skyline-screenshots --update-snapshots=all
          else
            just skyline-screenshots
          fi

      - name: Upload baselines and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyline-screenshot-baselines
          path: |
            apps/syn-ui/e2e/baselines/*-linux.png
            apps/syn-ui/e2e/.results
          retention-days: 14
          if-no-files-found: ignore

  #############################################################################
  # GATEWAY - production image serves Skyline at / (SYN_GATEWAY_UI=next) and
  # React at / with Skyline at /next (legacy) (just skyline-gateway-smoke)
  #############################################################################

  gateway:
    name: Gateway serves syn-ui at /
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      # Builds infra/docker/images/gateway (both UI stages, the Skyline size
      # budget included), runs it in each SYN_GATEWAY_UI mode with no API
      # behind it, and checks routing, redirects, caching, headers and the
      # API proxy with infra/scripts/check_gateway_ui.py.
      - name: Build gateway and smoke-test routing
        run: just skyline-gateway-smoke

  #############################################################################
  # DESKTOP - the Tauri shell (apps/syn-desktop): bridge tests + cargo
  #############################################################################

  desktop:
    name: Desktop shell (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'syn-ui...'

      # tauri::generate_context! embeds build.frontendDist (../../syn-ui/dist)
      # at compile time, so the web build must exist before any cargo command.
      - name: Build syn-ui (frontendDist)
        run: pnpm --filter syn-ui run build

      # Zero-dependency bridge that syn-ui imports; Node strips the types.
      - name: Bridge tests
        working-directory: apps/syn-desktop
        run: node --experimental-strip-types --no-warnings --test bridge/index.test.ts

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      # ISS-259: pinned to a commit, same pin as ci.yml.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cargo test
        working-directory: apps/syn-desktop/src-tauri
        run: cargo test --locked

# =============================================================================
# Check: Version Consistency
# =============================================================================
# Validates that all 11 version files match and the version is greater than
# what's currently on the release branch.
#
# Called by: release-gate.yml
#
# NOTE on the `_check-` prefix and flat layout:
# GitHub Actions does NOT support reusable workflows in subdirectories of
# .github/workflows/ — they MUST live at the top level. Moving them into a
# `checks/` subdir produces a cryptic "invalid workflow reference" failure
# with 0 jobs and the path-as-name in the UI. The `_check-` prefix is our
# convention for grouping reusable-only (workflow_call) workflows visually.
# =============================================================================

name: Check - Version Consistency

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Need release branch history for comparison

      # uv picks the interpreter from .python-version, the repo's one pin, not
      # whatever python3 the runner image ships (#1242). --no-project: these
      # scripts are stdlib only, so the workspace (and its submodules, which
      # this checkout does not fetch) is never installed.
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Validate all 11 version files match
        run: uv run --no-project python scripts/workflows/bump_version.py --check

      - name: Validate version is bumped vs release branch
        run: uv run --no-project python scripts/workflows/bump_version.py --check-release

      # WHY: `release` means "this is what production runs". A prerelease
      # version sitting on that branch breaks the invariant: every consumer
      # then has to parse the version string to know whether the branch tip
      # is real, and the beta has to be unwound before the next release.
      #
      # Betas do not go near this branch. They are cut from `main` as
      # prerelease tags (see release-beta.yaml), which publishes images
      # without `latest` and the CLI under `next`.
      #
      # This makes the mistake impossible rather than discouraged.
      - name: Refuse a prerelease version on a PR into release
        if: github.base_ref == 'release'
        run: |
          VERSION=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Version under review: ${VERSION}"
          if [[ "${VERSION}" =~ (-|\+) ]]; then
            echo "::error file=pyproject.toml::Refusing to merge prerelease version '${VERSION}' into 'release'."
            echo "::error::The release branch carries production versions only. Cut a beta from main instead:"
            echo "::error::  gh release create v${VERSION} --prerelease --target main"
            exit 1
          fi
          echo "OK: '${VERSION}' is a production version."


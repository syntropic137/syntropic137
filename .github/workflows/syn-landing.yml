name: Landing page

# syntropic137.com (apps/syn-landing), moved in from
# syntropic137/syntropic137-landing-page (design/landing-plan.md, P4). These are
# that repo's ci.yml and security.yml gates, with the same pinned action SHAs.
# The page has no preview deployments (apps/syn-landing/vercel.json), so this
# workflow is what checks a PR: copy lint, build, Lighthouse against a local
# `vite preview` of the build, and the idle-CPU energy test.
#
# Security: the old security.yml's OSV scan and dependency review are already
# ci.yml's osv-scan and dependency-review, which read the root pnpm-lock.yaml
# that now locks this app; its npm audit (advisory only there) is the same OSV
# data. CodeQL and gitleaks had no monorepo equivalent, so they are ported
# below, scoped to apps/syn-landing.
#
# Every job has a recipe that runs the same commands locally (just/landing.just):
# landing-copy-lint, landing-typecheck + landing-build, landing-lighthouse,
# landing-energy.

on:
  pull_request:
    branches: [main, release]
    paths:
      - 'apps/syn-landing/**'
      # P5+ build the page from Skyline's themes and elements.
      - 'packages/syn-ui/**'
      # Install inputs: a lockfile or workspace change can break the build
      # without touching a landing file.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'just/landing.just'
      - '.github/workflows/syn-landing.yml'
  push:
    branches: [main]
    paths:
      - 'apps/syn-landing/**'
      - 'packages/syn-ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'just/landing.just'
      - '.github/workflows/syn-landing.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ISS-259: least-privilege default, as in ci.yml. Jobs that need more declare it.
permissions:
  contents: read

jobs:
  #############################################################################
  # COPY LINT - no em dashes in user-facing copy (just landing-copy-lint)
  #############################################################################

  copy-lint:
    name: Landing copy lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for em dashes in user-facing content
        run: bash apps/syn-landing/scripts/check-copy.sh

  #############################################################################
  # BUILD - typecheck and vite build; the dist/ artifact feeds lighthouse and
  # energy (just landing-typecheck, just landing-build)
  #############################################################################

  build:
    name: Landing build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile installs exactly what is locked; --ignore-scripts
      # blocks postinstall hooks (ISS-259). The filter keeps the install to the
      # landing page's graph.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'syn-landing...'

      # vite build does not type-check; tsc --noEmit does (just landing-typecheck).
      - name: Typecheck
        run: pnpm --filter syn-landing run typecheck

      # `build` first runs `elements` (skyline-svelte-v5 build:elements with its
      # 45 KB gzip budget): the page imports the <sky-*> elements from
      # dist-elements/, which is git-ignored.
      - name: Build
        run: pnpm --filter syn-landing run build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: syn-landing-dist
          path: apps/syn-landing/dist/
          retention-days: 7

  #############################################################################
  # LIGHTHOUSE - desktop preset against `vite preview` of the build. Minimums:
  # Performance 90, Accessibility 90, Best Practices 85, SEO 90
  # (apps/syn-landing/lighthouserc.json; just landing-lighthouse)
  #############################################################################

  lighthouse:
    name: Landing Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'syn-landing...'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: syn-landing-dist
          path: apps/syn-landing/dist/

      - name: Serve the build (vite preview)
        run: |
          pnpm --filter syn-landing exec vite preview --port 8080 --strictPort > /tmp/vite-preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/vite-preview.log
          echo "::error::vite preview did not answer on :8080"
          exit 1

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: http://localhost:8080/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: apps/syn-landing/lighthouserc.json

      - name: Format Lighthouse results
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const globber = await glob.create('.lighthouseci/lhr-*.json');
            const files = await globber.glob();
            if (files.length === 0) return;
            const lhr = JSON.parse(fs.readFileSync(files[0], 'utf8'));
            const scores = Object.entries(lhr.categories).map(([key, cat]) => {
              const score = Math.round(cat.score * 100);
              const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟡' : '🔴';
              return `| ${cat.title} | ${emoji} ${score} |`;
            });
            const body = [
              '## Lighthouse Results (syn-landing)',
              '',
              '| Category | Score |',
              '|----------|-------|',
              ...scores,
              '',
              `> Tested: ${lhr.finalUrl}`,
            ].join('\n');

            // Enforce minimum scores: fail CI if any category is below threshold.
            // Same numbers as apps/syn-landing/lighthouserc.json.
            const thresholds = {
              performance: 90,
              accessibility: 90,
              'best-practices': 85,
              seo: 90,
            };
            const failures = [];
            for (const [key, cat] of Object.entries(lhr.categories)) {
              const score = Math.round(cat.score * 100);
              const min = thresholds[key];
              if (min && score < min) {
                failures.push(`${cat.title}: ${score} (minimum: ${min})`);
              }
            }

            const statusLine = failures.length > 0
              ? `\n\n**CI will fail**, scores below threshold:\n${failures.map(f => `- ${f}`).join('\n')}`
              : '\n\nAll scores meet minimum thresholds.';

            const fullBody = body + statusLine;

            // Write to job summary
            await core.summary.addRaw(fullBody).write();

            // Comment on PR if this is a pull request
            if (context.payload.pull_request) {
              const marker = '<!-- lighthouse-ci-syn-landing -->';
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });
              const existing = comments.find(c => c.body.includes(marker));
              const commentBody = `${marker}\n${fullBody}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: commentBody,
                });
              }
            }

            // Fail the step if any score is below threshold
            if (failures.length > 0) {
              core.setFailed(`Lighthouse scores below threshold:\n${failures.join('\n')}`);
            }

  #############################################################################
  # ENERGY - under 500ms of CPU over 5s of idle, measured after 35s, and no
  # infinite CSS animations (tests/energy.spec.ts; just landing-energy)
  #############################################################################

  energy:
    name: Landing energy (idle CPU)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'syn-landing...'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: syn-landing-dist
          path: apps/syn-landing/dist/

      # The app's own Playwright, so the browser build matches the runner.
      - name: Install Chromium
        working-directory: apps/syn-landing
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      # playwright.config.ts serves dist/ with vite preview (CI=true: never
      # reuses a server that happens to be running).
      - name: Energy test
        env:
          CI: 'true'
        run: pnpm --filter syn-landing run test:energy

  #############################################################################
  # CODEQL - SAST over the landing page's TypeScript (from its security.yml)
  #############################################################################

  codeql:
    name: Landing CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Finds XSS, injection, path traversal, insecure deserialization, etc.
      # Scoped to the landing page; the rest of the monorepo is out of scope here.
      - uses: github/codeql-action/init@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths:
              - apps/syn-landing
            paths-ignore:
              - apps/syn-landing/node_modules
              - apps/syn-landing/dist
      - uses: github/codeql-action/autobuild@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
      - uses: github/codeql-action/analyze@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        with:
          category: syn-landing

  #############################################################################
  # SECRET SCAN - gitleaks over every commit that touches apps/syn-landing
  # (from its security.yml). -m diffs merges too, so the subtree import itself
  # is scanned; the old repo's own history (before the import, at its root
  # paths) was gitleaks-clean there and is immutable
  #############################################################################

  secret-scan:
    name: Landing secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Full history: scan all commits, not just HEAD
      # gitleaks CLI directly avoids the gitleaks-action org license requirement.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --log-opts="--full-history -m -- apps/syn-landing" --exit-code 1

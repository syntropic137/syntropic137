name: E2E Container Execution

on:
  push:
    branches: [main]
    paths:
      - "packages/syn-adapters/src/syn_adapters/workspaces/**"
      - "packages/syn-domain/src/syn_domain/contexts/workflows/**"
      # The GITLINK itself, not only paths inside it. A submodule bump changes
      # exactly one superproject entry - `lib/agentic-primitives` - and a
      # superproject diff never exposes files inside a submodule, so the two
      # nested globs below CANNOT match a bump. Verified on PR #941, which
      # moved the omni-agent Dockerfile (claude-code 2.1.126 -> 2.1.250, codex
      # 0.144.6 -> 0.150.1) and ran this workflow zero times. The nested globs
      # stay for in-tree edits during submodule development.
      - "lib/agentic-primitives"
      - "lib/agentic-primitives/providers/workspaces/**" # ADR-029: workspace images
      - "lib/agentic-primitives/primitives/**" # ADR-029: hooks
      - ".github/workflows/e2e-container.yml"
      # A digest bump changes which image every deployment runs, so it must
      # trigger the workflow that exercises workspace images.
      - "packages/syn-shared/src/syn_shared/settings/workspace_images.py"
      - "scripts/e2e_agent_in_container_test.py"
  pull_request:
    paths:
      - "packages/syn-adapters/src/syn_adapters/workspaces/**"
      - "packages/syn-domain/src/syn_domain/contexts/workflows/**"
      # The GITLINK itself, not only paths inside it. A submodule bump changes
      # exactly one superproject entry - `lib/agentic-primitives` - and a
      # superproject diff never exposes files inside a submodule, so the two
      # nested globs below CANNOT match a bump. Verified on PR #941, which
      # moved the omni-agent Dockerfile (claude-code 2.1.126 -> 2.1.250, codex
      # 0.144.6 -> 0.150.1) and ran this workflow zero times. The nested globs
      # stay for in-tree edits during submodule development.
      - "lib/agentic-primitives"
      - "lib/agentic-primitives/providers/workspaces/**" # ADR-029: workspace images
      - "lib/agentic-primitives/primitives/**" # ADR-029: hooks
      - ".github/workflows/e2e-container.yml"
      # A digest bump changes which image every deployment runs, so it must
      # trigger the workflow that exercises workspace images.
      - "packages/syn-shared/src/syn_shared/settings/workspace_images.py"
      - "scripts/e2e_agent_in_container_test.py"
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: "Run full E2E with live API calls (requires secrets)"
        type: boolean
        default: false

concurrency:
  group: e2e-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  #############################################################################
  # DOCKER BUILD - Validate workspace image (runs in parallel)
  # Target: <3 minutes with cache
  #############################################################################

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Set up Python for build script
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Build workspace image via build-provider.py
        working-directory: lib/agentic-primitives
        run: |
          uv run scripts/build-provider.py claude-cli --tag agentic-workspace-claude-cli:latest

      - name: Verify image through its entrypoint
        run: |
          # Probe THROUGH /opt/agentic/entrypoint.sh, not around it. The previous
          # --entrypoint form proved a binary existed while bypassing the startup
          # path that actually configures the workspace, so an entrypoint
          # regression passed. The `|| echo` on the claude probe also made that
          # check unconditionally green; a failure now fails the job.
          docker run --rm agentic-workspace-claude-cli:latest python3 --version
          docker run --rm agentic-workspace-claude-cli:latest claude --version

  #############################################################################
  # E2E CONTAINER TEST - Full integration (manual trigger only)
  #############################################################################

  e2e-container:
    name: E2E Container Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-build]
    if: github.event.inputs.run_full_e2e == 'true'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install & Run E2E
        run: |
          uv sync --all-extras
          # Build workspace image via build-provider.py (stages required context)
          cd lib/agentic-primitives && uv run scripts/build-provider.py claude-cli --tag agentic-workspace-claude-cli:latest && cd ../..
          uv run python scripts/e2e_agent_in_container_test.py

  #############################################################################
  # SUMMARY
  #############################################################################

  e2e-success:
    name: E2E Success
    if: always()
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          echo "✅ E2E container checks passed"

# =============================================================================
# Release Gate — Pre-merge validation for main → release PRs
# =============================================================================
#
# Runs on PRs targeting the `release` branch. All jobs must pass before merge.
#
# Checks:
#   1. Version consistency — all 11 package files match and are bumped
#   2. Release notes — PR body must contain meaningful release notes
#   3. Codegen sync — CLI types, CLI docs, API docs all match source
#   4. Docker dry-run — all container images build successfully (single-arch, cached)
#   5. Security scans — OSV, pip-audit, dependency review
#
# Full CI (tests, lint, typecheck) also runs on these PRs via ci.yml.
#
# Each check lives in .github/workflows/ with the `_check-` prefix as a
# reusable workflow. (GitHub Actions does not support subdirectories for
# reusable workflows — they must be at the top level.)
# =============================================================================

name: Release Gate

on:
  pull_request:
    branches: [release]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Reusable checks
  #
  # NOTE: GitHub Actions does NOT support reusable workflows in subdirectories
  # of .github/workflows/ — they must live at the top level. The `_check-*`
  # prefix visually groups them and signals they only fire via workflow_call
  # (they appear as greyed-out entries in the Actions sidebar).
  # ---------------------------------------------------------------------------
  version-check:
    uses: ./.github/workflows/_check-version.yml

  changelog-check:
    uses: ./.github/workflows/_check-changelog.yml
    with:
      pr_body: ${{ github.event.pull_request.body }}

  codegen-sync:
    uses: ./.github/workflows/_check-codegen-sync.yml

  docker-dry-run:
    uses: ./.github/workflows/_check-docker-dry-run.yml

  # ---------------------------------------------------------------------------
  # Security Scans — inline (not duplicated elsewhere, no extraction needed)
  # ---------------------------------------------------------------------------
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=uv.lock
            --lockfile=pnpm-lock.yaml
            --lockfile=lib/ui-feedback/backend/ui-feedback-api/uv.lock

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install pip-audit
        run: uv tool install pip-audit==2.7.3

      - name: Audit Python dependencies
        run: |
          uv export --format requirements-txt --no-hashes --frozen --quiet \
            | uv tool run pip-audit --disable-pip --no-deps -r /dev/stdin
          # No allowlist. A new advisory fails this job; fix it with a pin or an
          # exclude-newer-package entry in pyproject.toml, not an --ignore-vuln.

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@f5b971718edcbb31275a1db40004592335c0e031 # v4.9.0
        with:
          # #1793: same allow-list as ci.yml. apps/syn-desktop (Tauri 2) pins
          # gtk 0.18 -> glib 0.18.5 (GHSA-wrw7-89jp-8q8g, moderate); the fix
          # is unreachable until Tauri moves. OSV scan still reports it.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  # ---------------------------------------------------------------------------
  # Aggregator — required status check for branch protection
  # ---------------------------------------------------------------------------
  release-gate-success:
    name: Release Gate
    if: always()
    needs:
      - version-check
      - changelog-check
      - codegen-sync
      - docker-dry-run
      - osv-scan
      - pip-audit
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates passed
        run: |
          echo "version-check:    ${{ needs.version-check.result }}"
          echo "changelog-check:  ${{ needs.changelog-check.result }}"
          echo "codegen-sync:     ${{ needs.codegen-sync.result }}"
          echo "docker-dry-run:   ${{ needs.docker-dry-run.result }}"
          echo "osv-scan:         ${{ needs.osv-scan.result }}"
          echo "pip-audit:        ${{ needs.pip-audit.result }}"
          echo "dependency-review:${{ needs.dependency-review.result }}"

          FAILED=0
          check() {
            local job="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::${job} did not pass (result: ${result})"
              FAILED=1
            fi
          }
          check "version-check"    "${{ needs.version-check.result }}"
          check "changelog-check"  "${{ needs.changelog-check.result }}"
          check "codegen-sync"     "${{ needs.codegen-sync.result }}"
          check "docker-dry-run"   "${{ needs.docker-dry-run.result }}"
          check "osv-scan"         "${{ needs.osv-scan.result }}"
          check "pip-audit"        "${{ needs.pip-audit.result }}"
          check "dependency-review" "${{ needs.dependency-review.result }}"

          if [[ "$FAILED" == "1" ]]; then
            exit 1
          fi

          echo "All release gates passed."

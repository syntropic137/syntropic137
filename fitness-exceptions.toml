# Grandfathered violations. Every entry MUST reference a GitHub issue.
# This file should SHRINK over time — each entry is tech debt.
#
# Budgets ratcheted to actual value rounded up to nearest multiple of 5.
# Thresholds: cognitive ≤ 15, cyclomatic ≤ 10, LOC function ≤ 100, LOC file ≤ 750

# ═══════════════════════════════════════════════════════════════════════════════
# Maximum Cognitive Complexity (function-level, threshold: 15)
# ═══════════════════════════════════════════════════════════════════════════════

# Three waivers were REMOVED here. The tool had been reporting them as
# `NowPassing` stale exceptions for an unknown number of green runs:
#
#   get_execution_status_endpoint  cognitive 11, waiver 20  (#317)
#   validate_credentials           cognitive  8, waiver 20  (#316)
#   _docker_rm                     cognitive  7, waiver 20  (#316)
#
# The global cognitive limit is 15. Each function was already well under it,
# so the waiver was not covering debt - it was standing permission to add
# 9 to 13 points of complexity back to code somebody had already fixed, and
# the next author to do so would have been waved through.
#
# A waiver outlives the debt it was granted for unless something deletes it.
# `just fitness-check` now fails when the tool reports a stale exception, so
# this cannot silently accumulate again.

# ═══════════════════════════════════════════════════════════════════════════════
# Maximum Cyclomatic Complexity (function-level, threshold: 10)
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# Maximum LOC (function-level, threshold: 100)
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# Maximum LOC (file-level, threshold: 750)
# ═══════════════════════════════════════════════════════════════════════════════

# WorkflowExecutionProcessor's max-loc-file exception was REMOVED here (#1036).
# It stood at 750-778 across four raises since #934. The #1036 failure-duration
# fix pushed the file to 802; rather than raise a fifth time, the outcome
# assembly for BOTH paths moved to `phase_outcome.py` and the two identical
# terminal-teardown blocks were deduped, taking the file under the global 750.
# #934 still owns splitting `run`/`_handle_run_agent` out of this class.

[max-loc-file."apps.syn-api.src.syn_api._wiring"]
value = 1200
issue = "#185"

# ═══════════════════════════════════════════════════════════════════════════════
# Untyped Dicts - str-keyed mappings with unconstrained values, per package.
# Default is 0 (clean). Every non-zero entry is grandfathered tech debt.
#
# RATCHET INVARIANT: values MAY ONLY DECREASE. Never bump a value up to
# accommodate new untyped dicts. Type them with TypedDict or Pydantic
# before merging. The threshold is a ceiling on existing tech debt, not
# a budget for new debt.
#
# RE-BASELINED 2026-09-05 (#1188). These five values were re-measured, NOT
# raised. The gate used to grep for the literal string "dict[str, Any]"; it now
# parses each file, so Mapping[str, object], MutableMapping[str, Any],
# Dict[str, Any], quoted and line-wrapped spellings are counted for the first
# time, and mentions in docstrings and comments stopped being counted at all.
# Same debt, correct measure. Before -> after, and why each moved:
#
#   syn-domain     387 -> 413   +34 newly visible, -8 prose
#   syn-adapters   195 -> 205   +10 newly visible
#   syn-api         94 -> 139   +45 newly visible
#   syn-collector   22 ->  22   unchanged
#   syn-shared      10 ->  11   +1 newly visible
#
# syn-api is the finding: a third of its untyped surface was never being
# measured. The debt did not appear on 2026-09-05, it was always there. The
# invariant above applies unchanged from this baseline forward.
#
# Every value is now the exact measured count, so no entry carries headroom.
# syn-domain previously allowed 391 against a real 387; a ratchet with slack in
# it permits exactly the growth it exists to stop.
# ═══════════════════════════════════════════════════════════════════════════════

[untyped-dicts.syn-domain]
path = "packages/syn-domain"
value = 413
issue = "#673"

[untyped-dicts.syn-adapters]
path = "packages/syn-adapters"
value = 205
issue = "#673"

[untyped-dicts.syn-api]
path = "apps/syn-api"
value = 139
issue = "#673"

[untyped-dicts.syn-collector]
path = "packages/syn-collector"
value = 22
issue = "#673"

[untyped-dicts.syn-shared]
path = "packages/syn-shared"
value = 11
issue = "#673"

# Test-marker census (justfile: check-test-markers).
# CI selects tests by marker (`pytest -m unit`), so a test with no marker is
# collected by no job and can fail on main indefinitely behind a green check.
# That is exactly what happened on 2026-08-17 - see
# docs/retrospectives/2026-08-17-green-checks-that-check-nothing.md
#
# `unmarked` must ratchet to 0. `xfail` counts disarmed guards: an xfail on a
# correctness invariant is a disabled alarm, not a known issue.
[test-markers.unmarked]
# Tightened 1329 -> 1169 to remove 160 tests of slack. A ratchet with headroom
# is not a ratchet: it silently permits exactly the growth it exists to stop.
# 1169 is the measured census on this commit, so the number can only fall.
value = 1169
issue = "#825"

[test-markers.xfail]
value = 2
issue = "#444"

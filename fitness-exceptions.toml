issue = "#934"  # 760 -> 763 for #895's session-store dep, then -> 773 for the concurrency fix cross-model review found: the leader-id map was processor-instance state keyed by phase_id alone, on a processor the dispatcher SHARES across runs, so two concurrent executions of one workflow could read each other's leader and silently import no delegate. Paid down four ways first (delegate import, teardown loop, conversation recording, observation payload - about 200 lines out) and the pop was pushed into phase_delegate_import rather than kept here. What remains is run/_handle_run_agent/_handle_complete_phase, ~250 lines that genuinely belong elsewhere; #934 tracks that split. Raising a debt ceiling twice in one PR is not good practice - the alternative was blocking a correctness fix on an unrelated refactor next to a release, which is worse. Then 773 -> 777 for #940: wiring the durable import ledger through the processor (one constructor param, one attribute, and the two call sites that must receive it). Same trade as before and deliberately the minimum - four lines, no new responsibility in this class, and the ledger itself lives in syn-adapters. #934 still owns the real split.


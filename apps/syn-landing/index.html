         latin-ext subsets only, in public/fonts/: no render-blocking third-party
         stylesheet. swap keeps text visible while they load; the headline face

    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

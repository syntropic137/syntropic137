[package]
name = "syn-desktop"
version = "0.1.0"
description = "Syntropic137 desktop shell: a Tauri 2 window around the Skyline web app (apps/syn-ui)."
edition = "2021"
rust-version = "1.77.2"
publish = false

# Standalone crate: keep it out of any parent Cargo workspace.
[workspace]

[lib]
name = "syn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

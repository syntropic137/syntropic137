through tsup 8.5.1 in syn-cli-node devDependencies and vite-plugin-dts 4.5.4 \
in ui-feedback-react devDependencies (`pnpm why sprintf-js -r`). It formats \
api-extractor's own CLI messages at build time, never untrusted input, and is \
not in any shipped bundle. \
Revisit when: sprintf-js publishes a release > 1.1.3 or osv.dev adds a `fixed` \
event (then add a pnpm override and delete this entry); sprintf-js appears on \
a production dependency path; or ignoreUntil lapses."""

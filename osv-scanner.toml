# OSV Scanner configuration for the root lockfiles (uv.lock, pnpm-lock.yaml).
#
# osv-scanner reads this file because it sits next to the lockfiles CI scans
# (.github/workflows/ci.yml and release-gate.yml, job `osv-scan`). Nested
# lockfiles do not inherit it.
#
# An entry here is ONLY for an advisory with no patched release. Anything with
# a fix gets the fix (a pnpm `overrides:` entry or a uv `constraint-dependencies`
# floor), never an ignore. Every entry carries:
#   - why no fix exists, with the osv.dev evidence
#   - which paths pull the package in
#   - the condition for revisiting it
#   - an `ignoreUntil` date, so the ignore lapses and CI fails again rather
#     than going stale silently

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-03
reason = """\
NO FIX EXISTS. braces: stack-exhaustion DoS through deeply nested patterns. \
osv.dev records only {introduced: 0, last_affected: 3.0.3} with no `fixed` \
event, and 3.0.3 is the newest version on npm (checked 2026-10-03). \
Dev-only path: syn-dashboard-ui devDependencies -> typescript-eslint 8.46.4 -> \
@typescript-eslint/typescript-estree -> fast-glob 3.3.3 -> micromatch 4.0.8 -> \
braces 3.0.3 (`pnpm why braces -r`). It runs only when ESLint lints our own \
source globs, never on untrusted input, and is not in any shipped bundle. \
Revisit when: braces publishes a release > 3.0.3 or osv.dev adds a `fixed` \
event (then add a pnpm override and delete this entry); braces appears on a \
production dependency path; or ignoreUntil lapses."""

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2027-01-05
reason = """\
NO FIX EXISTS. sprintf-js: DoS through unbounded precision specifiers. \
osv.dev records only {introduced: 0, last_affected: 1.1.3} with no `fixed` \
event, and 1.1.3 is the newest version on npm (checked 2026-10-05), so no \
override can clear it. Dev/build-only path (`pnpm why sprintf-js -r`): \
argparse 1.0.10 -> @rushstack/ts-command-line 5.3.14 -> \
@microsoft/api-extractor 7.59.1, reached via syn-cli-node devDependencies -> \
tsup 8.5.1 and ui-feedback-react devDependencies -> vite-plugin-dts 4.5.4. \
argparse calls sprintf only on its own help/usage/error templates built from \
api-extractor's static CLI definitions, at type-declaration build time on our \
own source; no untrusted input reaches a format string, and none of these \
packages is in the CLI, dashboard or docs runtime bundle. \
Revisit when: sprintf-js publishes a release > 1.1.3 or osv.dev adds a \
`fixed` event (then add a pnpm override and delete this entry); argparse 1.x \
leaves the api-extractor chain; sprintf-js appears on a production dependency \
path; or ignoreUntil lapses."""

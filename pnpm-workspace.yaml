packages:
  - apps/syn-dashboard-ui
  - apps/syn-docs
  - apps/syn-cli-node
  - packages/openclaw-plugin
  # Vendored in-tree (ADR-016), not a submodule - the dashboard consumes it
  # as a workspace package so the widget source and its host move together.
  - lib/ui-feedback/packages/ui-feedback-react
  # syn-ui: the Svelte 5 app and its Skyline component library
  # (packages/syn-ui/CONVENTIONS.md). Listed one by one, not as a glob, so
  # scripts/workflows/bump_version.py can be checked against this file.
  # Pre-release: versioned 0.0.0 independently until the cutover release,
  # when apps/syn-ui joins the product version (#1788).
  - apps/syn-ui
  - packages/syn-ui/data
  - packages/syn-ui/skyline-core
  - packages/syn-ui/skyline-svelte-v5
  - packages/syn-ui/themes

# Build scripts pnpm 11+ requires explicit approval for. Both are standard
# native-binary installs: esbuild fetches its platform binary (vite/tsx), sharp
# fetches libvips (syn-docs image pipeline). Left unset, pnpm refuses to run
# them and `just codegen` fails in any fresh checkout, so the pre-push hook can
# never pass.
allowBuilds:
  esbuild: true
  sharp: true

# First-party design-system packages (syntropic137/cross-framework-ui-design-system),
# published with provenance; exempt from the release-age cooldown so Skyline can
# pin a release the day it ships.
minimumReleaseAgeExclude:
  - '@syntropic137/design-contracts@0.1.0'


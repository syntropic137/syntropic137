# Envoy Sidecar Proxy Configuration for Syn137
# See: docker/sidecar-proxy/README.md
#
# This configuration:
# 1. Intercepts outbound HTTP/HTTPS requests
# 2. Injects authentication tokens via ext_authz filter
# 3. Logs all requests for observability
# 4. Enforces rate limits

# The only runtime value this proxy reads from disk is the platform-access
# switch, written by entrypoint.sh from SYN_PLATFORM_ACCESS_ENABLED (ADR-072).
# There is deliberately NO admin_layer: port 9901 is reachable from
# agent-net, and an admin layer would let a workspace POST /runtime_modify and
# turn the platform route on while the setting is OFF.
layered_runtime:
  layers:
    - name: static
      static_layer: {}
    - name: syn_platform_switch
      disk_layer:
        symlink_root: /var/lib/syn-envoy-runtime
        subdirectory: envoy

# The admin interface is LOOPBACK ONLY (ADR-072). Port 9901 is reachable from
# agent-net, and admin on it would let any workspace raise the log level
# (POST /logging?level=trace) and have Envoy print every request's headers,
# including other workspaces' Authorization: Bearer platform tokens, or end the
# proxy (POST /quitquitquit). The `admin_ready` listener below keeps 9901
# answering GET /ready, the only admin path anything outside this container uses.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9900

static_resources:
  listeners:
    # Readiness only, for the healthcheck, the API's shared-proxy check and
    # the smoke test. Every other path is a local 404: never the admin API.
    - name: admin_ready
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: admin_ready
                codec_type: AUTO
                route_config:
                  name: admin_ready
                  virtual_hosts:
                    - name: admin_ready
                      domains:
                        - "*"
                      routes:
                        - match:
                            path: "/ready"
                          route:
                            cluster: envoy_admin_loopback
                            timeout: 5s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # HTTP Proxy listener (agents connect here)
    - name: http_proxy
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          host: "%REQ(:AUTHORITY)%"
                          response_code: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          execution_id: "%REQ(X-Syn-EXECUTION-ID)%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    # Anthropic API
                    # Matches both direct api.anthropic.com traffic AND requests routed
                    # via ANTHROPIC_BASE_URL=http://envoy-proxy:8081 (ISS-43).
                    # host_rewrite_literal ensures upstream sees api.anthropic.com.
                    - name: anthropic
                      domains:
                        - "api.anthropic.com"
                        - "api.anthropic.com:443"
                        - "envoy-proxy:8081"
                        - "envoy-proxy"
                      routes:
                        # Syntropic137 API, workspace ingress (PC-127, ADR-072).
                        # SYN_API_URL=http://envoy-proxy:8081/syn-platform; the
                        # CLI appends /api/v1. Sent straight to api:8000, never
                        # through the gateway (gateway:80 has no auth).
                        # x-syn-workspace-ingress is OVERWRITTEN, so the API
                        # knows a workspace sent this whatever the workspace
                        # set, and refuses it without a platform token whose
                        # scope allows the route. ext_authz is OFF here so no
                        # provider credential is ever added to an API request;
                        # the workspace's own Bearer token passes unchanged.
                        - match:
                            prefix: "/syn-platform/api/v1/"
                            runtime_fraction:
                              # OFF unless entrypoint.sh found
                              # SYN_PLATFORM_ACCESS_ENABLED true: no route, so
                              # nothing reaches the API (ADR-072).
                              default_value:
                                numerator: 0
                                denominator: HUNDRED
                              runtime_key: syn_platform.access_enabled
                          route:
                            cluster: syn_platform_api
                            timeout: 30s
                            prefix_rewrite: "/"
                          request_headers_to_add:
                            - header:
                                key: "x-syn-workspace-ingress"
                                value: "envoy"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            path: "/syn-platform/health"
                            runtime_fraction:
                              # OFF unless entrypoint.sh found
                              # SYN_PLATFORM_ACCESS_ENABLED true: no route, so
                              # nothing reaches the API (ADR-072).
                              default_value:
                                numerator: 0
                                denominator: HUNDRED
                              runtime_key: syn_platform.access_enabled
                          route:
                            cluster: syn_platform_api
                            timeout: 10s
                            prefix_rewrite: "/health"
                          request_headers_to_add:
                            - header:
                                key: "x-syn-workspace-ingress"
                                value: "envoy"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            prefix: "/syn-platform/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error": "Not found", "message": "Only /syn-platform/api/v1/ and /syn-platform/health reach the platform"}'
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            prefix: "/"
                          route:
                            cluster: anthropic_api
                            timeout: 300s # Long timeout for streaming
                            host_rewrite_literal: "api.anthropic.com"
                          request_headers_to_add:
                            - header:
                                key: "anthropic-version"
                                value: "2023-06-01"

                    # GitHub API
                    - name: github
                      domains:
                        - "api.github.com"
                        - "api.github.com:443"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: github_api
                            timeout: 30s

                    # GitHub Raw Content
                    - name: github_raw
                      domains:
                        - "raw.githubusercontent.com"
                        - "raw.githubusercontent.com:443"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: github_raw
                            timeout: 30s

                    # GitHub HTTPS (git clone goes through proxy) - ISS-43
                    - name: github_https
                      domains:
                        - "github.com"
                        - "github.com:443"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: github_https
                            timeout: 120s

                    # pypi.org / files.pythonhosted.org / registry.npmjs.org
                    # used to be passthrough virtual hosts here. They were dead
                    # code: agent containers do not set HTTP_PROXY, so pip/npm
                    # always hit those hosts direct via agent-net egress. Removed
                    # to shrink the proxy's stats and TLS-context footprint.

                    # Block all other hosts
                    - name: blocked
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 403
                            body:
                              inline_string: '{"error": "Host not allowed", "message": "Only approved hosts are allowed through the proxy"}'

                http_filters:
                  # External authorization for token injection (HTTP mode)
                  # The token-injector service checks the Host header and returns
                  # credential headers. Envoy OVERWRITES matching upstream headers
                  # with the values from allowed_upstream_headers.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      http_service:
                        server_uri:
                          uri: http://token-injector:9002
                          cluster: token_injector
                          timeout: 5s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: "host"
                              - exact: "x-forwarded-host"
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: "x-api-key"
                              - exact: "authorization"
                              - exact: "x-syn-execution-id"
                      failure_mode_allow: false

                  # Rate limiting
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 100
                        tokens_per_fill: 10
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Envoy's own admin interface, loopback only (see `admin` above).
    - name: envoy_admin_loopback
      type: STATIC
      load_assignment:
        cluster_name: envoy_admin_loopback
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9900

    # Anthropic API cluster
    - name: anthropic_api
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: anthropic_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.anthropic.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.anthropic.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    # GitHub API cluster
    - name: github_api
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: github_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.github.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.github.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    # GitHub Raw Content cluster
    - name: github_raw
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: github_raw
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: raw.githubusercontent.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: raw.githubusercontent.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    # GitHub HTTPS cluster (git clone) - ISS-43
    - name: github_https
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: github_https
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: github.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: github.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    # Syntropic137 API (PC-127, ADR-072). Reached directly, never through the
    # gateway: gateway:80 serves the internal network with no auth at all.
    - name: syn_platform_api
      type: STRICT_DNS
      load_assignment:
        cluster_name: syn_platform_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api
                      port_value: 8000

    # Token Injector Service (separate container on same Docker network)
    - name: token_injector
      type: STRICT_DNS
      load_assignment:
        cluster_name: token_injector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: token-injector
                      port_value: 9002
      # HTTP/1.1 — token injector is a plain Python HTTP server

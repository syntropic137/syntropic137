# Development Docker Compose - Overrides for local development
# Usage: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up
# Shortcut: just dev
#
# Adds: container names, ports, persistent volumes, restart policies.
# Service definitions (images, health checks, deps) are in docker-compose.yaml.
#
# See: ADR-034 - Test Infrastructure Architecture
# See: ADR-060 - On-Demand Environment Creation
#
# Project name "syn-dev" avoids clashing with the selfhost stack ("syntropic137").
name: syn-dev

services:
  timescaledb:
    container_name: syn-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  event-store:
    container_name: syn-event-store
    ports:
      - "50051:50051"
    restart: unless-stopped

  collector:
    container_name: syn-collector
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Definition in docker-compose.yaml; only container_name + restart here
  docker-socket-proxy:
    container_name: syn-docker-socket-proxy
    restart: unless-stopped

  api:
    container_name: syn-api
    build:
      args:
        INCLUDE_DOCKER_CLI: "1"
    # No direct port mapping in dev: the gateway on 9137 is the single
    # entry point and mirrors production's 8137 (which fronts via nginx
    # the same way). Use docker exec or a one-off `-p` override if you
    # need to bypass the gateway for debugging.
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/selfhost-entrypoint.sh"]
    command: ["sh", "-c", "uvicorn syn_api.main:app --host $${SYN_API_HOST:-0.0.0.0} --port $${SYN_API_PORT:-8000}"]
    env_file:
      - ../.env # Load environment variables from root .env file
    environment:
      # Override .env localhost values with Docker service names (ADR-030)
      SYN_OBSERVABILITY_DB_URL: postgres://syn:syn_dev_password@timescaledb:5432/syn
      EVENT_STORE_HOST: event-store
      EVENT_STORE_PORT: "50051"
      # MinIO storage for artifacts (ADR default is 'local' which isn't implemented)
      SYN_STORAGE_PROVIDER: minio
      SYN_STORAGE_MINIO_ENDPOINT: minio:9000
      SYN_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      SYN_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # 1Password-managed secrets: shell env (from resolve_infra_env.py) overrides env_file
      SYN_GITHUB_APP_ID: ${SYN_GITHUB_APP_ID:-}
      SYN_GITHUB_APP_NAME: ${SYN_GITHUB_APP_NAME:-}
      SYN_GITHUB_PRIVATE_KEY: ${SYN_GITHUB_PRIVATE_KEY:-}
      SYN_GITHUB_WEBHOOK_SECRET: ${SYN_GITHUB_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Codex auth.json contents for `provider: codex` phases (bridge). Injected
      # into the agent workspace over the setup phase; scoped to codex phases only.
      CODEX_AUTH_JSON: ${CODEX_AUTH_JSON:-}
      # Workspace directory configuration for Docker-in-Docker
      # Container path where workspaces are accessible
      SYN_WORKSPACE_CONTAINER_DIR: /workspaces
      # Host path that Docker daemon can mount (must match volume mount below).
      # ${PWD} (compose's invocation dir) is the correct default for worktrees;
      # SYN_INSTALL_DIR can be set explicitly to override the install directory.
      SYN_WORKSPACE_HOST_DIR: ${SYN_INSTALL_DIR:-${PWD}}/workspaces
      # Agent network: matches the compose-prefixed name for this stack (syn-dev_agent-net).
      # Each compose stack gets its own prefix, preventing cross-stack container leakage.
      # Production override: SYN_AGENT_NETWORK=syntropic137_agent-net (or whatever that stack's prefix is)
      SYN_AGENT_NETWORK: syn-dev_agent-net
    volumes:
      - ./selfhost-entrypoint.sh:/selfhost-entrypoint.sh:ro
      # Mount workspace directory for container file sharing
      # Host path (${PWD}/workspaces) -> Container path (/workspaces)
      - ../workspaces:/workspaces

  minio:
    container_name: syn-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    container_name: syn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  envoy-proxy:
    container_name: syn-envoy-proxy
    ports:
      - "8081:8081"
      - "9901:9901" # Envoy admin
    restart: unless-stopped

  token-injector:
    container_name: syn-token-injector
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # Dev-only: dashboard with Vite HMR. Source mounted from host so file
  # edits trigger reload; node_modules lives in a named volume so the
  # baked image's deps are not shadowed by the host mount.
  # ─────────────────────────────────────────────────────────────────────
  dashboard-dev:
    container_name: syn-dashboard-dev
    build:
      context: ..
      dockerfile: apps/syn-dashboard-ui/Dockerfile.dev
    volumes:
      # Source mount for HMR. node_modules is shielded by the named volume below.
      - ../apps/syn-dashboard-ui:/workspace/apps/syn-dashboard-ui
      - dashboard_node_modules:/workspace/apps/syn-dashboard-ui/node_modules
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # Gateway: nginx fronting both the API and the dashboard-dev container.
  # Mirrors production routing so the CLI works without SYN_NO_PREFIX=1.
  # The baked-in nginx.conf is overridden with nginx.conf.dev.
  # ─────────────────────────────────────────────────────────────────────
  gateway:
    container_name: syn-gateway
    build:
      context: ..
      dockerfile: infra/docker/images/gateway/Dockerfile
    # Port convention: 9137 = dev gateway (this), 8137 = production/selfhost
    # gateway. CLI users point SYN_API_URL at http://localhost:9137 for dev.
    ports:
      - "9137:80"
    volumes:
      - ../infra/docker/images/gateway/nginx.conf.dev:/etc/nginx/conf.d/default.conf:ro
      # Vite dev mode emits inline scripts (react-refresh init, HMR client);
      # the production CSP (script-src 'self') blocks them and the dashboard
      # white-screens. Mount an empty file over the strict policy in dev.
      - /dev/null:/etc/nginx/conf.d/security-headers.conf:ro
    environment:
      # Dev gateway is unauthenticated; the entrypoint generates an empty
      # auth.conf when SYN_API_PASSWORD is empty.
      SYN_API_PASSWORD: ""
      SYN_API_USER: admin
    depends_on:
      api:
        condition: service_healthy
      dashboard-dev:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
  redis_data:
  dashboard_node_modules:

networks:
  default:
    name: syn-dev-network

# VSA Configuration for Syntropic137
# See: https://github.com/neuralempowerment/event-sourcing-platform/vsa for documentation

version: 1
root: ./packages/syn-domain/src/syn_domain/contexts
language: python

# Event sourcing framework integration
framework:
  name: event-sourcing-platform
  base_types:
    domain_event:
      import: "event_sourcing"
      class: "DomainEvent"
    aggregate:
      import: "event_sourcing"
      class: "AggregateRoot"
    command_handler:
      import: "event_sourcing"
      class: "CommandHandler"

# Validation rules
validation:
  require_tests: true
  require_integration_events_in_shared: true
  max_nesting_depth: 3
  allow_nested_features: true
  # Shared read-model projections consumed by sibling slices (not cross-slice violations)
  exclude_from_isolation:
    - "list_repos"
    - "list_systems"
  # Commands live at domain/commands/ with handlers in slices/ (DDD convention per ADR-020)
  domain_level_commands: true

# Projection purity whitelist (VSA032)
#
# The rule is default-deny: a projection may import stdlib and the event-sourcing
# framework, nothing else. That is the right default - a projection must be pure and
# replay-safe - but it has no way to know that reading a domain read-model or a shared
# value object is exactly what a projection is FOR.
#
# These prefixes are deliberately narrow. A bare "syn_domain" would neuter the rule
# entirely, which is worse than not having it: the point is to keep projections from
# reaching for adapters, clients, or anything with side effects.
#
# `syn_adapters.projection_stores` is the one adapter module allowed: it is the
# persistence seam a checkpointed projection writes through. Any OTHER syn_adapters
# import from a projection still fails, which is what we want.
projection_allowed_prefixes:
  - "syn_domain.contexts"          # read models, _shared value objects, sibling events
  - "syn_shared"                   # pricing, typed constants, agent enums
  - "syn_adapters.projection_stores"
  - "event_sourcing"
  # KNOWN WEAKENING (issue #817). VSA032 does not honour the exception budgets
  # below - only VSA204/205/206 do - so these two stdlib modules are whitelisted
  # globally to un-block the gate, which is strictly better than leaving the
  # whole gate disabled. Both current uses are recorded in #817:
  #   - asyncio: a per-execution Lock serialising projection writes in
  #     execution_todo (68bf36f2). Defensible.
  #   - time: time.monotonic() rate-limiting inside dispatch_triggered_workflow -
  #     a "projection" that also DISPATCHES and keeps _dispatch_timestamps. Per
  #     ADR-025 that is the ProcessManager anti-pattern; the import is the
  #     symptom. Fixing that projection is the real remedy, after which this
  #     entry should be removed.
  # Cost of the weakening: the rule can no longer catch wall-clock reads in a
  # projection, which is a genuine replay-safety smell. Retire ASAP.
  - "asyncio"
  - "time"

# KNOWN LIMITATION of the whitelist above (issue #817).
#
# VSA032 matches import PREFIXES. It does not inspect symbols or follow
# transitive imports. So `syn_domain.contexts` admits a genuinely impure module
# that happens to live under an allowed prefix - e.g. a projection could import
# `syn_domain.contexts.github._shared.github_client` and make HTTP calls while
# the rule stays green.
#
# Enumerating exact pure modules instead was considered and rejected: it would
# be brittle (every new read model needs a config edit) and it still would not
# catch a transitive impure dependency, which is the actual risk. The real fix
# is symbol/transitive analysis in the validator itself.
#
# What this configuration DOES buy, and why it is still worth having: adapters,
# API packages, and clients outside syn_domain remain blocked, and VSA206 below
# independently catches `syn_adapters` imports from slice code. Treat VSA032 as
# a coarse filter, not a proof of purity.

# Layer separation enforcement (VSA206)
# Domain and slice code must not import from adapter/API packages at runtime
layer_separation:
  forbidden_domain_imports:
    - "syn_adapters"
    - "syn_api"
    - "syn_collector"
  forbidden_adapter_imports:
    - "syn_api"

# Grandfathered violations (issue #817)
#
# CI ran vsa 0.6.1-beta for months while the submodule pinned 0.12.0, so every
# rule added in that window never executed. Un-freezing the gate surfaced 65
# pre-existing violations; 51 were resolved outright and these 14 are budgeted
# so the gate is REAL going forward rather than disabled again.
#
# Budgets are per-file with exact counts, so a NEW violation in one of these
# files still fails the build - only the known ones are absorbed.
#
# THIS LIST SHOULD ONLY EVER GET SHORTER.
exceptions:
  # Genuine hexagonal violations: slice code reaching for adapters. Want ports.
  - file: "orchestration/slices/execute_workflow/handlers/WorkspaceProvisionHandler.py"
    rule: "VSA206"
    budget: 4
    issue: "#817"
  - file: "orchestration/slices/execute_workflow/handlers/AgentExecutionHandler.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"
  - file: "orchestration/slices/execute_workflow/ConversationRecorder.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"
  - file: "orchestration/slices/execute_workflow/CancelSignalPoller.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"
  # Projections importing syn_adapters.projection_stores - arguably the
  # legitimate persistence seam, but budgeted rather than blessed until decided.
  - file: "organization/slices/list_systems/projection.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"
  - file: "organization/slices/list_repos/projection.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"
  - file: "github/slices/trigger_history/projection.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"
  - file: "github/slices/list_triggers/projection.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"
  - file: "github/slices/get_installation/projection.py"
    rule: "VSA206"
    budget: 1
    issue: "#817"

# Cross-context public API enforcement (ADR-062)
# Scan adapter and API layers for deep cross-context imports
cross_context_scan_paths:
  - "packages/syn-adapters/src"
  - "apps/syn-api/src"

# Pattern definitions (Python conventions)
patterns:
  command: "*Command"
  event: "*Event"
  handler: "*Handler"
  query: "*Query"
  integration_event: "*IntegrationEvent"
  test: "test_*"

# Domain layer configuration (for manifest --include-domain)
domain:
  path: domain
  aggregates:
    path: "."
    pattern: "**/*Aggregate.*"
  commands:
    path: "commands"
    pattern: "**/*Command.*"
  events:
    path: "events"
    pattern: "**/*Event.*"
  queries:
    path: "queries"
    pattern: "**/*Query.*"

# Context-specific configuration
# NOTE: Reorganized per ADR-020 bounded-context-aggregate-relationship
contexts:
  orchestration:
    description: "Workflow execution and workspace management (merged from workflows + workspaces)"
  agent_sessions:
    description: "Agent sessions, token tracking, and execution metrics"
  artifacts:
    description: "Artifact storage, metadata, and retrieval"
  github:
    description: "GitHub App integration, installation tokens, and secure credential management"
  organization:
    description: "Organization, system, and repo management"
  # DEPRECATED: These contexts are being phased out (see ADR-020)
  # workflows:
  #   description: "DEPRECATED - Use orchestration"
  # workspaces:
  #   description: "DEPRECATED - Use orchestration"
  # costs:
  #   description: "DEPRECATED - projections moved to orchestration/agent_sessions"
  # metrics:
  #   description: "DEPRECATED - projections moved to orchestration"
  # observability:
  #   description: "DEPRECATED - projections moved to agent_sessions"

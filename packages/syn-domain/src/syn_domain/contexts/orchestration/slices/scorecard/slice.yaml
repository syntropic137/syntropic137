name: get-scorecard
type: query
projection: ScorecardProjection
subscribes_to:
  - ExecutionRequestedEvent
  - WorkflowExecutionStartedEvent
  - PhaseCompletedEvent
  - AgentExecutionCompletedEvent
  - WorkflowCompletedEvent
  - WorkflowFailedEvent
  - ExecutionCancelledEvent
  - WorkflowInterruptedEvent
returns: Scorecard

name: get-workflow-detail
type: query
projection: WorkflowDetailProjection
subscribes_to:
  - WorkflowTemplateCreatedEvent
  - WorkflowExecutionStartedEvent
  - PhaseStartedEvent
  - PhaseCompletedEvent
  - WorkflowCompletedEvent
  - WorkflowFailedEvent
  - WorkflowTemplateUpdatedEvent
  - WorkflowTagsAddedEvent
  - WorkflowTagsRemovedEvent
returns: WorkflowDetail | None

[project]
name = "syn-domain"
version = "1.0.4"
description = "Core domain model for Syntropic137"
requires-python = ">=3.12"

dependencies = [
    "syn-shared",
    "pydantic>=2.12.5",
    "event-sourcing-python",
    "pyyaml>=6.0.2",
    "cryptography>=46.0.5",  # ADR-076: Ed25519 signed-lane verification (D2)
    "agentic-events",  # ADR-029: JSONL parsing utilities
]

[build-system]
requires = ["uv_build>=0.9.13"]
build-backend = "uv_build"

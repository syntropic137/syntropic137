<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","workflows","executions","evals","sessions","artifacts","triggers","repos"],"default":"overview"},"$preview":{"width":1440,"height":78}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'overview';
const mk = (key) => {
const on = active === key;
return {
bg: on ? '#1A2134' : 'transparent',
fg: on ? '#E8EEFB' : '#9AA8C7',
ic: on ? 'var(--ac, #4D80FF)' : '#6F7FA3',
w: on ? 600 : 500,
sh: on ? 'inset 0 1px 0 rgba(255, 255, 255, 0.07)' : 'none'
};
};
return {
overview: mk('overview'),
workflows: mk('workflows'),
executions: mk('executions'),
sessions: mk('sessions'),
artifacts: mk('artifacts'),
triggers: mk('triggers'),
repos: mk('repos'),
evals: mk('evals')
};
}
}
</script>

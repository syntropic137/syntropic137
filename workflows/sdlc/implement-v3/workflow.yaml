id: sdlc-implement-v3
name: "SDLC: Premise, implement + draft PR, verify, fix, re-verify, mark ready (v3)"
description: >
  Take a well-specified issue to a reviewed pull request: check the premise,
  make the change, verify it independently, fix what verification found and
  confirm the fix (up to three rounds), open the PR. Verification is separate
  from implementation on purpose, and a defect it finds is repaired rather than
  ending the run.
type: implementation
classification: standard
requires_repos: true

# The task IS the brief: every phase reads it as $ARGUMENTS, and without one the
# run implements nothing at full cost (PC-66, exec-2dced6933763). Declaring it
# required is what makes admission refuse a missing, empty or whitespace-only
# task, at the API and in `syn workflow run`.
inputs:
  - name: task
    description: "The well-specified issue or change to implement"
    required: true

# WHY THIS EXISTS.
#
# The workflow that had been doing this work, `implement-from-plan-v1`, existed
# only as database state - it appears nowhere in this repository, so its phase
# budgets and prompts could not be reviewed, diffed or fixed in a pull request.
# The same was true of `PR Review` (#1035). Both are the workflows that do the
# actual SDLC work, and neither was under version control (#1031).
#
# WHY IMPLEMENT AND VERIFY ARE SEPARATE PHASES.
#
# Measured on 2026-08-30, four runs of the old three-phase shape whose single
# `Implement` phase had to change the code AND verify it within 1800s:
#
#   exec-1717c4da51c8  completed  1113s
#   exec-9dcfe2c87357  completed  1316s
#   exec-e8cb453a850d  FAILED     exit_code=124 (hit 1800s)
#   exec-1205971c9f13  FAILED     exit_code=124 (hit 1800s)
#
# Two of four exceeded the budget, and the successes used 62% and 73% of it. The
# tasks that failed were the ones that asked for premise verification, pasted
# command output and an integration test - which is to say, the ones asking for
# the discipline that makes the output trustworthy.
#
# Raising the number alone treats a phase doing two jobs as a phase that is
# merely slow. A phase that must finish a change AND prove it will shortchange
# the proving, because the change feels like the deliverable. Splitting them
# means verification starts from a finished diff and has its own budget, and a
# run that fails is attributable to the job that ran out of room.

# Software leverage points, injected into EVERY phase. Workflow scope reaches
# all phases; the per-phase blocks below are additive, naming the points that
# phase is actually being judged on.
#
# NOT `software-leverage-review`: its own SKILL.md requires `claude -p` because
# it fans out 17 subagents, and "an orchestrator that is itself a subagent
# cannot fan out". A workflow phase IS that subagent.
skills:
  - syntropic137/software-leverage-points/principles-and-patterns@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
  - syntropic137/software-leverage-points/architecture@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454

phases:
  # Phase ids are load-bearing: a later phase reads the previous one's output at
  # artifacts/input/<phase-id>.md, so renaming a phase breaks the one after it.
  - id: premise
    name: Check the task's premise
    order: 1
    execution_type: sequential
    input_artifacts: []
    output_artifacts:
      - markdown
    timeout_seconds: 1200
    # Its deliverable is a report, not a branch. The gate exempts an
    # uncommitted change here only once the repo is also mounted read-only,
    # which production does not do yet (#1308, #1342), so this declaration is
    # correct but not yet in effect. See workflows/sdlc/README.md.
    delivers_repo_changes: false
    allowed_tools:
      - Read
      - Grep
      - Glob
      - Bash
      - Write
    agent:
      provider: claude
      model: opus
    skills:
      - syntropic137/software-leverage-points/purpose-and-scope@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/architecture@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/principles-and-patterns@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
    prompt_file: phases/premise.md

  - id: implement
    name: Make the change
    order: 2
    execution_type: sequential
    input_artifacts:
      - markdown
    output_artifacts:
      - markdown
    timeout_seconds: 3600
    allowed_tools:
      - Read
      - Grep
      - Glob
      - Bash
      - Edit
      - Write
    agent:
      provider: claude
      model: opus
    skills:
      - syntropic137/software-leverage-points/architecture@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/principles-and-patterns@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/types@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/error-handling@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
    prompt_file: phases/implement.md

  - id: verify
    name: Verify the change independently
    order: 3
    execution_type: sequential
    input_artifacts:
      - markdown
    output_artifacts:
      - markdown
    timeout_seconds: 3600
    # Its deliverable is a report, not a branch. The gate exempts an
    # uncommitted change here only once the repo is also mounted read-only,
    # which production does not do yet (#1308, #1342), so this declaration is
    # correct but not yet in effect. See workflows/sdlc/README.md.
    delivers_repo_changes: false
    # A review: no review_verdict fails the phase instead of advancing by order (PC-116).
    requires_verdict: true
    # No allowed_tools: this phase runs on codex, which enforces a
    # filesystem sandbox rather than a tool vocabulary. A tool list here
    # would be accepted and never applied, so the validator refuses it.
    agent:
      provider: codex
      # `gpt-sol` is the platform's codex alias: stored as written, sent to
      # codex as `--model gpt-6.1-sol`, and priced as gpt-6.1-sol (#892 no longer
      # applies - the alias resolves to a rate). Timeouts and any timing or
      # cost figures in this file were measured under gpt-5.6-sol
      # (pre-2026-09-24); re-measure before tuning them against this model.
      model: gpt-sol
    skills:
      - syntropic137/software-leverage-points/testing@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/error-handling@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/architecture@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/software-complexity@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
    prompt_file: phases/verify.md

  - &fix_round
    id: fix
    name: Address what verification found
    order: 4
    execution_type: sequential
    input_artifacts:
      - markdown
    output_artifacts:
      - markdown
    timeout_seconds: 3600
    allowed_tools:
      - Read
      - Grep
      - Glob
      - Bash
      - Edit
      - Write
    agent:
      provider: claude
      model: opus
    skills:
      - syntropic137/software-leverage-points/architecture@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/types@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/error-handling@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/principles-and-patterns@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
    prompt_file: phases/fix.md

  - &reverify_round
    id: reverify
    name: Confirm the fix closed what verification found
    order: 5
    execution_type: sequential
    input_artifacts:
      - markdown
    output_artifacts:
      - markdown
    # Half of verify's budget: this pass checks a delta, not the whole change,
    # and its prompt forbids re-reviewing what the first pass already certified.
    timeout_seconds: 1800
    # Its deliverable is a report, not a branch. The gate exempts an
    # uncommitted change here only once the repo is also mounted read-only,
    # which production does not do yet (#1308, #1342), so this declaration is
    # correct but not yet in effect. See workflows/sdlc/README.md.
    delivers_repo_changes: false
    # A review: no review_verdict fails the phase instead of advancing by order (PC-116).
    requires_verdict: true
    # No allowed_tools: this phase runs on codex, which enforces a
    # filesystem sandbox rather than a tool vocabulary. A tool list here
    # would be accepted and never applied, so the validator refuses it.
    agent:
      provider: codex
      # `gpt-sol` is the platform's codex alias: stored as written, sent to
      # codex as `--model gpt-6.1-sol`, and priced as gpt-6.1-sol (#892 no longer
      # applies - the alias resolves to a rate). Timeouts and any timing or
      # cost figures in this file were measured under gpt-5.6-sol
      # (pre-2026-09-24); re-measure before tuning them against this model.
      model: gpt-sol
    skills:
      - syntropic137/software-leverage-points/testing@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/error-handling@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/security@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/architecture@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
    prompt_file: phases/reverify.md

  # BOUNDED REPAIR ROUNDS (PC-63). On 2026-10-05 four runs (#1589, #1596,
  # #1597, #1603) ended with `reverify` BLOCKED on findings one more edit would
  # have closed, and each needed a second round built by hand. The engine
  # advances strictly by `order` and has no loop construct, so the repeat is
  # written out here instead: two extra fix/reverify pairs, the same prompts
  # under new ids. That makes the bound part of the definition - three rounds
  # in total, never more - and every round a phase on the execution, so the
  # round count is visible there. Each round has its own prompt file because a
  # prompt may name only phases that have already run; the files differ only in
  # their "Which round this is" section, and the test below keeps them so.
  #
  # A round whose predecessor CERTIFIED never runs. Each reverify reports a
  # `review_verdict` (certified | blocked) in its TASK_RESULT, and the execution
  # aggregate - not the prompts - picks the next phase from it: `certified`
  # skips every phase before the final one (recorded as `skipped_phase_ids`
  # on NextPhaseReady), `blocked` advances by order. A run that is still
  # blocked after round 3 completes with `review_verdict: blocked`, i.e. with
  # unresolved findings, on the execution, and a resume of it re-runs `fix_3`
  # onward. See review_rounds.py. `finalize_pr` must therefore stay the LAST
  # phase. `finalize_pr` reads the newest round that ran, of `reverify_3/`,
  # `reverify_2/`, `reverify/`. Adding a round
  # means a pair here, two prompt files, and a line in phases/finalize_pr.md;
  # scripts/tests/test_implement_v3_repair_rounds.py fails if they disagree.
  - <<: *fix_round
    id: fix_2
    name: Address what verification found (round 2)
    order: 6
    prompt_file: phases/fix_2.md

  - <<: *reverify_round
    id: reverify_2
    name: Confirm the fix closed what verification found (round 2)
    order: 7
    prompt_file: phases/reverify_2.md

  - <<: *fix_round
    id: fix_3
    name: Address what verification found (round 3)
    order: 8
    prompt_file: phases/fix_3.md

  - <<: *reverify_round
    id: reverify_3
    name: Confirm the fix closed what verification found (round 3)
    order: 9
    prompt_file: phases/reverify_3.md

  - id: finalize_pr
    name: Open the pull request
    order: 10
    execution_type: sequential
    input_artifacts:
      - markdown
    output_artifacts:
      - markdown
    timeout_seconds: 600
    # Its deliverable is a report, not a branch. The gate exempts an
    # uncommitted change here only once the repo is also mounted read-only,
    # which production does not do yet (#1308, #1342), so this declaration is
    # correct but not yet in effect. See workflows/sdlc/README.md.
    delivers_repo_changes: false
    # NO WORKING TREE (#1187). This phase reads the verify artifact, checks a
    # remote ref and calls `gh pr create`. Its prompt already says the branch
    # is on origin and that it must not push, so the checkout it was paying
    # for was never used: it cloned the repo and every submodule, plus the
    # @-imported CLAUDE.md that comes with a clone, to do about 30s of work.
    # Dropping an unused clone is worth it on its own, and that is the whole
    # of the justification for `clone_repos: false`.
    #
    # CORRECTED (this note used to say the clone "ran out of the shortest
    # budget in the workflow in ~30% of runs"). It cannot have. The clone
    # happens in the setup phase, under its own separate
    # SYN_SETUP_PHASE_TIMEOUT_SECONDS; the 600s above is handed only
    # to the agent process, on a workspace that already exists. See
    # workflows/sdlc/README.md, "What `timeout_seconds` actually bounds".
    #
    # So the ~30% failure rate #1187 saw was real but MISATTRIBUTED, and
    # removing the clone did not necessarily fix it. If this phase is still
    # timing out, the cause is in the agent's own work and this comment is not
    # the place to look. Do not raise the 600s to make room for a clone that
    # was never spending it.
    #
    # `gh` still works: the repo is still resolved to its installation, still
    # gets a token, and still gets a hosts.yml entry. Only the clone is gone.
    clone_repos: false
    # `can_open_pr: true` used to sit here, with a comment claiming this was
    # THE ONLY PHASE ALLOWED TO PUBLISH (#1197) and that an earlier phase could
    # not route around the verifier by calling `gh pr create` first - the thing
    # that happened on exec-0bac0e1ed2b2.
    #
    # That claim was never true. #1477 established the field is inert: every
    # phase token carries the installation's own permissions, so every phase
    # could always open and comment on a PR. The field is now retired (#1502)
    # and fails the repo gate, so it is removed rather than left asserting an
    # enforcement that does not exist. The ordering this workflow wants still
    # needs a real mechanism; it does not have one.
    allowed_tools:
      - Read
      - Bash
      - Write
    agent:
      provider: claude
      model: opus
    skills:
      - syntropic137/software-leverage-points/documentation@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
      - syntropic137/software-leverage-points/purpose-and-scope@7e48aad9c7186bb03b8b0df899f56b7cd3b2a454
    prompt_file: phases/finalize_pr.md

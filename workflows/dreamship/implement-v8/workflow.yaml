id: dreamship-implement-v8
name: dreamship-implement-v8
description: >
  v8 of dreamship-implement. v7 (same prompts, models, phase order, timeouts,
  pinned skills) plus: implement and remediate run software-leverage-review in
  their own session (its claude -p is not logged in inside a workspace) with all
  20 leverage points installed for its reviewers, and review reads each skill
  in full, one file per command. See README.md.
type: implementation
classification: standard
requires_repos: true

phases:
  - id: implement
    name: 'Implement behind a failing test, then open the PR'
    order: 1
    execution_type: sequential
    prompt_file: phases/implement.md
    output_artifacts: [markdown]
    timeout_seconds: 7200
    skills:

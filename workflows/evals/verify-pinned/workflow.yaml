id: eval-verify-pinned-v1
name: "Eval: verify the pinned checkout, read-only (v1)"
description: >
  One read-only verify phase over the commit the workspace was provisioned at.
  It exists to be measured: the verifier-seed eval suite (evals/verifier-seed-v1)
  launches it against commits known to carry an escaped bug and scores whether
  the verdict is blocked and the report names the defect.
type: custom
classification: standard
requires_repos: true

inputs:
  - name: task
    description: "What the change under review claims to do, and where to look"
    required: true

# WHY NOT sdlc-reverify-pr-v1 (#967 step 8). Its `prepare` refuses a merged PR,
# checks out the PR head and merges main into it - and main carries every
# seed's fix, so the bug would be gone before verify saw it. It also pushes.
# This workflow verifies exactly the commit the eval's Baseline pinned (the
# checkout is read back after provisioning since #1615) and writes nothing back.
#
# THE MODEL IS PART OF THE MEASUREMENT. evals/verifier-seed-v1/suite.yaml
# records this workflow's id and each phase's model, and
# scripts/tests/test_eval_suite.py fails when the two disagree. Change the model
# here and bump the suite's version with it, or two runs of "the same" suite
# stop being comparable.

phases:
  - id: verify
    name: Verify the pinned checkout independently
    order: 1
    execution_type: sequential
    input_artifacts: []
    output_artifacts:
      - markdown
    timeout_seconds: 3600
    delivers_repo_changes: false
    # A review: no review_verdict fails the phase instead of completing it, so
    # the eval scores ERROR rather than a FAIL nobody judged (PC-116, #1780).
    requires_verdict: true
    allowed_tools:
      - Read
      - Grep
      - Glob
      - Bash
      - Write
    agent:
      provider: claude
      model: opus
    prompt_file: phases/verify.md

id: codex-delegates-to-claude
name: Codex delegates a subtask to Claude
description: A codex-primary phase that shells out to `claude -p` one-shot (opt-in delegation).
type: research
classification: simple
requires_repos: false
phases:
  - id: build-and-delegate
    name: Codex builds, delegates review to Claude
    order: 1
    execution_type: sequential
    input_artifacts: []
    output_artifacts:
      - text
    timeout_seconds: 600
    agent:
      provider: codex
      allow_delegation: true
      # `gpt-sol` is the platform's codex alias: stored as written, sent to
      # codex as `--model gpt-6-sol`, and priced as gpt-6-sol (#892 no longer
      # applies - the alias resolves to a rate). Timeouts and any timing or
      # cost figures in this file were measured under gpt-5.6-sol
      # (pre-2026-09-24); re-measure before tuning them against this model.
      model: gpt-sol
    prompt_template: |
      Implement palindrome.py with is_palindrome(s: str) -> bool. Then delegate a
      code review to Claude Code with one shell command:
      `claude -p --permission-mode bypassPermissions --output-format stream-json
      --verbose "Review /workspace/palindrome.py for correctness; reply with a
      one-line verdict"`. Print Claude's verdict, then a one-line summary.

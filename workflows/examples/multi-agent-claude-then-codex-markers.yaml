id: multi-agent-markers
name: Multi-agent shared workspace (claude marker → codex marker)
description: |
  Two-phase workflow that uses simple marker-string prompts (proven
  to work with the TUI readiness heuristic). Proves: (a) phase 1
  dispatches to claude pane; (b) phase 2 ALSO dispatches to codex
  pane on the SAME shared workspace; (c) the stress-blockers fix
  unblocked the artifact-pipeline race that previously prevented
  phase 2 from running.

type: research
classification: standard
repository: null
requires_repos: false
project_name: null

inputs: []

phases:
  - id: claude_first
    name: Phase 1 — claude marker
    order: 1
    execution_type: sequential
    argument_hint: "(none)"
    description: |
      Claude pane responds with a marker proving phase 1 dispatch.
    input_artifacts: []
    output_artifacts: []
    max_tokens: 1024
    timeout_seconds: 180
    agent:
      provider: claude-interactive
      agent_id: claude
    prompt_template: |
      Reply with the literal string CLAUDE_PHASE_ONE_OK and nothing
      else.

  - id: codex_second
    name: Phase 2 — codex marker on shared workspace
    order: 2
    execution_type: sequential
    argument_hint: "(none)"
    description: |
      Codex pane (same container as phase 1's claude pane) responds
      with a marker proving phase 2 dispatched on the shared
      workspace.
    input_artifacts: []
    output_artifacts: []
    max_tokens: 1024
    timeout_seconds: 180
    agent:
      provider: claude-interactive
      agent_id: codex
    prompt_template: |
      Reply with the literal string CODEX_PHASE_TWO_OK and nothing
      else.

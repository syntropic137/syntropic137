id: multi-agent-claude-then-codex
name: Multi-agent shared workspace (claude → codex)
description: |
  Two-phase workflow proving shared workspace state across agents.
  Phase 1 runs on Claude and writes /workspace/note.txt.
  Phase 2 runs on Codex (same EXP-04 swarm container, same filesystem)
  and reads the file. Used for the e2e bring-up of
  feat/multi-agent-workspaces.

type: research
classification: standard
repository: null
requires_repos: false
project_name: null

inputs: []

phases:
  - id: write
    name: Write the note (claude)
    order: 1
    execution_type: sequential
    argument_hint: "(none)"
    description: |
      Asks Claude to reply with a marker string so we know phase 1
      ran successfully. Used as the simplest possible round-trip
      proof on the claude pane.
    input_artifacts: []
    output_artifacts: []
    max_tokens: 1024
    timeout_seconds: 180
    agent:
      provider: claude-interactive
      agent_id: claude
    prompt_template: |
      Reply with the literal string PHASE_ONE_CLAUDE_OK and nothing
      else.

  - id: read
    name: Read on codex
    order: 2
    execution_type: sequential
    argument_hint: "(none)"
    description: |
      Asks Codex (running in the SAME tmux container as the Claude
      pane from phase 1) to reply with a marker string. Proves the
      shared interactive-tmux workspace is alive across phases AND
      that phase 2 was dispatched to the codex pane.
    input_artifacts: []
    output_artifacts: []
    max_tokens: 1024
    timeout_seconds: 180
    agent:
      provider: claude-interactive
      agent_id: codex
    prompt_template: |
      Reply with the literal string PHASE_TWO_CODEX_OK and nothing
      else.

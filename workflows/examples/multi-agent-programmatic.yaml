id: multi-agent-programmatic
name: Multi-agent (claude plans, codex implements)
description: |
  Phase 1 runs the claude driver and emits a plan artifact; phase 2 runs the
  codex driver and consumes it as an injected input artifact. Headless phases
  get separate workspaces, so the handoff is artifact-mediated (not a shared file).
type: research
classification: simple
requires_repos: false
phases:
  - id: plan
    name: Plan (claude)
    order: 1
    execution_type: sequential
    input_artifacts: []
    output_artifacts:
      - text
    timeout_seconds: 300
    agent:
      provider: claude
    prompt_template: |
      Write a one-paragraph plan for a palindrome checker to
      /workspace/artifacts/output/plan.md, then print the plan.
  - id: implement
    name: Implement (codex)
    order: 2
    execution_type: sequential
    input_artifacts:
      - text
    output_artifacts:
      - text
    timeout_seconds: 600
    agent:
      provider: codex
      # Verified 2026-08-26: the concrete model id IS accepted under ChatGPT
      # auth and is required for cost attribution. An unnamed model resolves to
      # no rate, and this platform never prices by substitution, so omitting it
      # makes the run unpriced. The ALIAS `gpt-5.6` is a different string and
      # may still be rejected ("model not supported when using Codex with a
      # ChatGPT account"); name the concrete id. See issue #892.
      model: gpt-5.6-sol
    prompt_template: |
      Read the plan artifact injected from the previous phase under
      /workspace/artifacts/input/ (the plan.md this workflow's phase 1
      produced), implement palindrome.py with tests, run them, and print a
      one-line result.

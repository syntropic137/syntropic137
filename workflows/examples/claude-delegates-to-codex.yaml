id: claude-delegates-to-codex
name: Claude delegates a subtask to Codex
description: A claude-primary phase that shells out to `codex exec` one-shot (opt-in delegation).
type: research
classification: simple
requires_repos: false

# WHY this exists as a counterpart to codex-delegates-to-claude.yaml: the
# delegation matrix has two directions and only one was covered by a shipped
# example, so the claude-leads path was never exercised by validation. A
# harness-neutral platform has to prove both, not assume symmetry.

phases:
  - id: plan-and-delegate
    name: Claude plans, delegates implementation to Codex
    order: 1
    execution_type: sequential
    input_artifacts: []
    output_artifacts:
      - text
    timeout_seconds: 600
    agent:
      provider: claude
      allow_delegation: true
      model: haiku
    prompt_template: |
      Write a one-line spec for a function is_palindrome(s: str) -> bool that
      ignores case and non-alphanumeric characters. Then delegate the
      implementation to Codex with one shell command, run from /workspace:

      `cd /workspace && syn-delegate codex --timeout 600 --prompt="Create
      palindrome.py implementing is_palindrome(s: str) -> bool that ignores
      case and non-alphanumerics. Print DONE when the file exists."`

      Things that will break this if you change them:

      - Use `syn-delegate`, never a raw `codex exec`. It records the child in
        the session journal, passes Codex its own sandbox (`workspace-write`)
        and probes that sandbox before launching.
      - Keep the `=` in `--prompt="..."`, and run from under /workspace: the
        Codex sandbox only admits writable roots inside the workspace.
      - Never turn Codex's sandbox off. The workspace applies a seccomp (and,
        on AppArmor hosts, AppArmor) profile so bubblewrap works inside the
        container. If syn-delegate exits 69 (codex_sandbox_unavailable), stop
        and report it: the host is missing that policy (see
        docs/deployment/apparmor-codex-sandbox.md). Do not route around it.

      Then print Codex's output and a one-line summary of what was built.

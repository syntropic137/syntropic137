# The agentic-workspace verifier seed suite. verifier-seed-v1 pins one
# repository (syntropic137), and an eval's baseline holds one SHA per
# repository, so escapes in AgentParadise/agentic-workspace are their own
# suite. The rules are verifier-seed-v1's, unchanged: how a defect is pinned
# (the first fix commit's first parent; `check` enforces it), how a clean
# control is chosen, how a blocked run is judged, train and holdout. Read
# ../verifier-seed-v1/README.md and ../verifier-seed-v1/suite.yaml; README.md
# here holds only what differs.
#
# TRAIN AND HOLDOUT. Within each batch of added cases, the ~30% whose
# sha256(id) sorts lowest are holdout, fixed once and never moved to train:
# 1 of v1's 4 defects and none of its 2 controls (as with verifier-seed-v1's
# v6 pair), 1 of 6 in all.
#
# `check` reads the pins from an agentic-workspace checkout, not this one:
#   git submodule update --init lib/agentic-workspace
#   git -C lib/agentic-workspace fetch origin
#   uv run python scripts/eval_suite.py check --suite evals/verifier-seed-aw-v1 \
#     --repo lib/agentic-workspace
#
# v1: the four agentic-workspace escapes of 2026-10-13
#     (docs/retrospectives/2026-10-13-provider-contract-day.md): AW#47 and
#     AW#49 were certified by the platform verify (sdlc-implement-v3 /
#     sdlc-reverify-pr-v1 on codex) and blocked by a second verifier. Two
#     clean controls from agentic-workspace's imported mainline, chosen by
#     verifier-seed-v1's rule: agentic-primitives #358 (staged teardown) and
#     #395 (security-hardening runtime exposure, docs). Every other mainline
#     merge at least 30 days before clean_through (2026-09-13 or earlier)
#     back to #345 was read and fails a rule:
#       #355 provider logs: `check` finds #358 rewriting two of its functions
#       #399 RTK, #387 just, #356 and #347 exporter: later commits change
#         the same omni-agent Dockerfile within 30 days (3df7804 and e46bb72
#         for #399; #399, 3df7804, e46bb72 for #387; #363, #369 for the
#         two exporter PRs)
#       #376 delegation skills: #375 and 119f465 edit the same SKILL.md
#         files within 30 days; #375: 119f465 and fbb5cbb do
#       #362 session-store rename: #363, #369, #382 and #387 change the
#         omni-agent Dockerfile it touched within 30 days
#       #359, #348, #346, #345 session-store and entrypoint: superseded
#         within 30 days by #362 (renames the scripts they changed) and
#         cc89e13 (entrypoint.sh)
#       the rest are version-pin and release-bookkeeping bumps, which change
#         no behaviour a verifier could judge.
#     4 defects, 2 controls, 6 in all.
#
# v2: v1's six cases less one retired, two clean controls added, and a
#     treatment verifier, eval-verify-pinned-codex-checks-v1:
#     eval-verify-pinned-codex-v1 with one variable changed, the verify
#     prompt's three required checks. The experiment is preregistered in
#     experiments/2026-10-13-checks-treatment.md before any v2 run. v1 ran
#     eval-verify-pinned-codex-v1 only (launches.jsonl): catch 2/4,
#     false-block 2/2, keyword judge.
#     Retired: clean-runtime-exposure-docs, docs-only, so nothing in it can
#     be run or broken; it scores in v1 as it ran and is in no v2 figure.
#     Added, both Python code and tests, both chosen by the README rule
#     (`check` holds 1-3 for the Python; the rest was read by hand, in each
#     case file):
#       clean-event-type-identifiers: agentic-primitives #87 (ADR-042),
#         2026-02-20. Its imported merge 0dfa63a is titled with the PR, not
#         "Merge pull request #87", so v1's search for numbered merges
#         never saw it.
#       clean-deployment-identity: agentic-primitives #348, 2026-08-19. v1
#         excluded it because #362 renamed its script; #362 changed only
#         the header comment, so #348's lines stayed untouched (a move).
#     A third candidate, clean-workspace-run-contract (#240), was dropped
#     before any run: independent verification found a cancellation
#     ordering defect at its pin (an asyncio task cancelled during `start`
#     tears down before the worker registers the workspace). It is a
#     candidate defect, not a control, under the README.
#     Re-read and still excluded: #359, #346 and #345, whose shell changes
#     #360, #362 and cc89e13 rewrite within 30 days; #355, which `check`
#     rejects (#358 rewrites two of its functions).
#     TRAIN AND HOLDOUT for the v2 batch of two controls: none is holdout,
#     as with verifier-seed-v1's v6 pair (a batch of two has no ~30% to
#     hold out). v2: 7 live cases, 1 holdout; train is 3 defects and 3
#     controls, all code.
#
# v3: after the checks-treatment A/B (experiments/2026-10-13-checks-treatment.md,
#     Results). Both arms blocked all three v2 controls, and none of the
#     blocks could be scored as false:
#       clean-staged-teardown: both arms (exec-ca359d2d2e15 control,
#         exec-479751d1afef treatment) named the lock.locked() waiter race at
#         providers/docker.py:715 and _remove discarding docker rm's exit
#         status (:814). AW#56 fixed both in e241fdf ("lock.locked() cannot
#         tell: a waiter woken by release() does not hold the lock until it
#         resumes"). A real defect: retired, and reclassified as
#         teardown-lock-waiter-race at the same pin. The shield/cancel finding
#         (:755) has no fix (#56 lists it as not verified), so it is not
#         expected.
#       clean-deployment-identity (exec-5b26b73f76d9): the probe at
#         tests/integration/test_entrypoint_capabilities.py:4003 echoes
#         ${...:-unset}, which cannot tell an absent var from an empty one, and
#         the task asks whether the tests prove exactly that. A true finding,
#         not a false block; still unfixed on AW main, so retired with no
#         defect case (verifier-seed-v1 README: "once a fix exists").
#       clean-event-type-identifiers: blocked by both arms per the A/B
#         summary, but no run id or finding reached v3 (the artifacts API was
#         unreachable from the workspace that built it, and launches.jsonl
#         holds only v1 rows). Uninvestigated, so it cannot be kept as a
#         control: retired as a candidate defect.
#     Replacement controls: README rule 4 (new in v3) was applied to every
#     mainline merge on AW main (37f210b, 2026-10-13) at least 30 days old.
#     None qualifies, so v3 has NO clean controls and cannot measure false
#     blocks. Read in full in README "Rule 4"; in short, the only merges whose
#     changed functions survive to main untouched (#359, #360, #362) change
#     Python only in tests or docstrings, and their shell was rewritten within
#     30 days. Every other merge either changes no Python or has a function
#     rewritten later (#355, #345, #346, #55) or is a known defect (#240).
#     TRAIN AND HOLDOUT for the v3 batch of one defect: none is holdout. v3:
#     5 live cases, 1 holdout (replay-keeps-recorded-verdict); train is 4
#     defects and 0 controls.
#
# EVERY VERSION KEEPS ITS SCORE: when the version goes up, record the old one
# under `history`, as verifier-seed-v1 does.
id: verifier-seed-aw-v1
# Its own stable eval name: a case eval is tagged `suite:verifier-seed-aw` +
# `case:<id>`, never shared with verifier-seed-v1's.
eval_suite: verifier-seed-aw
version: 3
goal: >
  Does the verifier block an agentic-workspace change that carries a known
  escaped bug, naming the defect and the file it lives in, and certify a
  merged change that has no known defect?
repository: AgentParadise/agentic-workspace
# The same pinned verify workflows verifier-seed-v1 runs; the escapes were
# certified on codex, so both are listed.
workflows:
  - id: eval-verify-pinned-v1
    path: workflows/evals/verify-pinned/workflow.yaml
    models:
      verify: opus
  - id: eval-verify-pinned-codex-v1
    path: workflows/evals/verify-pinned-codex/workflow.yaml
    models:
      verify: gpt-sol
  - id: eval-verify-pinned-codex-checks-v1
    path: workflows/evals/verify-pinned-codex-checks/workflow.yaml
    models:
      verify: gpt-sol
history:
  - version: 1
    tag: verifier-seed-aw-v1:v1:eval-verify-pinned-codex-v1
    workflow: eval-verify-pinned-codex-v1
    cases:
      - clean-runtime-exposure-docs
      - clean-staged-teardown
      - execute-stderr-merged-into-stdout
      - replay-error-result-drops-verdict
      - replay-keeps-recorded-verdict
      - scripted-agent-tests-not-in-ci
  - version: 2
    tag: verifier-seed-aw-v1:v2:eval-verify-pinned-codex-v1
    workflow: eval-verify-pinned-codex-v1
    cases:
      - clean-deployment-identity
      - clean-event-type-identifiers
      - clean-staged-teardown
      - execute-stderr-merged-into-stdout
      - replay-error-result-drops-verdict
      - replay-keeps-recorded-verdict
      - scripted-agent-tests-not-in-ci
  - version: 2
    tag: verifier-seed-aw-v1:v2:eval-verify-pinned-codex-checks-v1
    workflow: eval-verify-pinned-codex-checks-v1
    cases:
      - clean-deployment-identity
      - clean-event-type-identifiers
      - clean-staged-teardown
      - execute-stderr-merged-into-stdout
      - replay-error-result-drops-verdict
      - replay-keeps-recorded-verdict
      - scripted-agent-tests-not-in-ci

task: >
  The change under review adds the workspace run contract to agentic_isolation:
  a typed spec and result for one agent run, a subprocess client for the itmux
  driver, and Workspace.run(), which provisions a workspace, streams the run's
  events and tears the workspace down, with cancellation. Review whether a run
  can leak a workspace or process, lose its events, or report a result that
  does not match what the agent did.

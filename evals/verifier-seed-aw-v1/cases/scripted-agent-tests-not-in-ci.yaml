  The change under review adds a new Python package, lib/python/scripted_agent,
  that replays recorded agent phases without contacting a model provider,
  with its own tests. Review the package and how its tests are run.
expected:
  # The root cause, for the LLM judge only; never part of `task`.
  defect: >
    The new lib/python/scripted_agent package's tests are never run by CI:
    the python-compatibility matrix in .github/workflows/ci.yml lists the
    other packages and omits scripted_agent, so every test it ships passes
    only locally and a regression in it merges green.
  files:

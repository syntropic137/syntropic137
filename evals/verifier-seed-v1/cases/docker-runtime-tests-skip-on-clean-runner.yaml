task: >
  The change under review adds a Docker workspace runtime and integration
  tests for it. Review whether those tests produce evidence on a clean runner
  with a Docker daemon, and what a run that cannot provision reports.
expected:
  # The root cause, for the LLM judge only; never part of `task`.
  defect: >
    test_docker_workspace_runtime.py skips the whole module unless
    SYN_CONTRACT_TEST_IMAGE is set, so on a clean runner with Docker the
    tests skip instead of running, and a skipped run looks the same as
    evidence nobody collected. The image is not pinned by the tests and a
    run that cannot provision skips rather than failing.
  files:
    - packages/syn-adapters/tests/test_docker_workspace_runtime.py
  keywords:
    - [skip, skips, skipped, skipif]
    - [SYN_CONTRACT_TEST_IMAGE, image, environment variable, env var, unset]

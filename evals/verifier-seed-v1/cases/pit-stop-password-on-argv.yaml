task: >
  Review the pit-stop deploy script (`just pit-stop <version>`), which drains
  executions, swaps the deployed images and verifies the API on the host,
  authenticating to the API with SYN_API_PASSWORD.
expected:
  # The root cause, for the LLM judge only; never part of `task`.
  defect: >
    scripts/pit_stop.sh passes the API credential to curl on the command
    line (`curl -u "admin:${SYN_API_PASSWORD}"` in api(), the maintenance

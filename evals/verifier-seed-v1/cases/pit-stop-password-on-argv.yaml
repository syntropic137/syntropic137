# present and nothing of the fix is. Evidence at the pin:
# `curl -fsS -u "admin:${SYN_API_PASSWORD}"` in `api()`, the maintenance PUT
# and `api_post()` (lines 69, 168, 398; 0 after); the fix passes the
# credential to curl on stdin.

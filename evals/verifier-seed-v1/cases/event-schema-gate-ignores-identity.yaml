task: >
  The change under review adds an event schema snapshot as a fitness gate and
  a release check, check-event-compat, that probes stored events against the
  current models. Review whether the two together refuse every change to an
  orchestration event that would break reading events already stored.
expected:
  # The root cause, for the LLM judge only; never part of `task`.
  defect: >
    The snapshot records only each event model's validation schema, not the
    event's type name and version, and the compat probe resolves models by
    Python class name. Renaming an event type, or bumping its version in the
    @event decorator, changes what stored events are read as while both the
    snapshot and check-event-compat stay green.
  files:
    - ci/fitness/event_sourcing/_orchestration_event_schemas.py
    - scripts/event_compat/probe.py
  keywords:
    - [event type, event_type, type name, version, identity, decorator, "@event"]
    - [snapshot, compat, probe, gate, schema]
split: train

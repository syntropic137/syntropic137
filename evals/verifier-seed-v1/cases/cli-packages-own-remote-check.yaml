task: >
  Review `syn workflow packages`, which lists installed workflow packages and
  hides entries whose local source path no longer exists, while always showing
  remote sources. Review whether it can disagree with install/update about
  which sources are remote.
expected:
  # The root cause, for the LLM judge only; never part of `task`.
  defect: >
    `syn workflow packages` decides whether a source is remote with its own
    predicate (contains '://' or starts with git@/ssh://) instead of
    parseSource, which install/update use and which accepts only https://,
    http://, git@ and ssh://. The two disagree for file://, ftp://, s3://,
    git:// and local paths containing '://', so packages misclassifies such
    sources (e.g. keeps listing a deleted local package as if remote).
  files:
    - apps/syn-cli-node/src/commands/workflow/install.ts
  keywords:
    - ["parsesource", "parse source", "resolver", "install", "update", "second", "own", "duplicate", "inline", "separate", "divergent", "diverge"]
    - ["remote", "local", "shorthand", "url"]
split: train
